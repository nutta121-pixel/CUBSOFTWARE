<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Twitch — CubDeck</title>
    <style>
        body { background: #0a0a14; color: #fff; font-family: 'Poppins', sans-serif;
               display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 20px; margin-bottom: 8px; }
        p { color: #888; font-size: 14px; }
    </style>
</head>
<body>
<div class="box">
    <div class="icon" id="icon">⏳</div>
    <h2 id="msg">Connecting to Twitch…</h2>
    <p id="sub">Please wait.</p>
</div>
<script>
    const MODE = {{ mode | tojson }};
    const RETURN_URL = {{ return_url | tojson }};
    const hash = window.location.hash.substring(1);
    const params = Object.fromEntries(new URLSearchParams(hash));
    const token = params.access_token;

    function fail(msg) {
        document.getElementById('icon').textContent = '❌';
        document.getElementById('msg').textContent = 'Connection failed';
        document.getElementById('sub').textContent = msg || 'No token received.';
    }

    if (!token) {
        fail(params.error_description || 'No token received.');
    } else if (MODE === 'chat') {
        // Chat token mode — fetch user info, then either postMessage (popup) or save server-side (redirect)
        document.getElementById('sub').textContent = 'Fetching your profile…';
        fetch('https://api.twitch.tv/helix/users', {
            headers: {
                'Authorization': 'Bearer ' + token,
                'Client-Id': '9n9yjc79p44kpsluv81kvvh6h9bxvu'
            }
        })
        .then(r => r.json())
        .then(data => {
            const user = data.data && data.data[0];
            if (!user) return fail('Could not fetch Twitch profile.');
            if (window.opener) {
                // Popup mode — pass token back to the deck page
                window.opener.postMessage({
                    type: 'cubdeck_twitch_token',
                    token,
                    login: user.login
                }, '*');
                document.getElementById('icon').textContent = '✅';
                document.getElementById('msg').textContent = 'Connected as ' + user.display_name;
                document.getElementById('sub').textContent = 'You can close this window.';
                setTimeout(() => window.close(), 1500);
            } else {
                // Redirect mode — save token server-side then return to deck
                document.getElementById('sub').textContent = 'Saving your connection…';
                fetch('/cubdeck/auth/twitch/save-chat-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, login: user.login })
                })
                .then(r => r.json())
                .then(d => {
                    if (d.ok) {
                        document.getElementById('icon').textContent = '✅';
                        document.getElementById('msg').textContent = 'Connected as ' + user.display_name;
                        document.getElementById('sub').textContent = 'Returning to your deck…';
                        setTimeout(() => { window.location.href = d.redirect || RETURN_URL; }, 800);
                    } else {
                        fail('Could not save connection. Please try again.');
                    }
                })
                .catch(() => fail('Network error. Please try again.'));
            }
        })
        .catch(() => fail('Could not fetch Twitch profile.'));
    } else {
        // Login mode — fetch Twitch user info then POST to server to create session
        document.getElementById('sub').textContent = 'Fetching your profile…';
        fetch('https://api.twitch.tv/helix/users', {
            headers: {
                'Authorization': 'Bearer ' + token,
                'Client-Id': '9n9yjc79p44kpsluv81kvvh6h9bxvu'
            }
        })
        .then(r => r.json())
        .then(data => {
            const user = data.data && data.data[0];
            if (!user) return fail('Could not fetch Twitch profile.');
            return fetch('/cubdeck/auth/twitch/session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: 'twitch_' + user.id,
                    username: user.display_name,
                    avatar: user.profile_image_url,
                    twitch_token: token,
                    twitch_login: user.login
                })
            });
        })
        .then(r => r && r.json())
        .then(data => {
            if (data && data.ok) {
                document.getElementById('icon').textContent = '✅';
                document.getElementById('msg').textContent = 'Logged in as Twitch!';
                document.getElementById('sub').textContent = 'Redirecting…';
                setTimeout(() => { window.location.href = data.redirect; }, 800);
            } else {
                fail('Session creation failed.');
            }
        })
        .catch(() => fail('Network error.'));
    }
</script>
</body>
</html>
