# Nginx Configuration - HTTP Only (Before SSL)
# Use this configuration for initial deployment before running certbot
#
# IMPORTANT: If this file is included via sites-enabled/, move the two
# limit_*_zone lines into the http {} block of your main nginx.conf instead.
# They are shown here for reference — they must live at http context level.
#
# limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
# limit_req_zone  $binary_remote_addr zone=req_limit_per_ip:10m rate=20r/s;

server {
    listen 80;
    server_name cubsoftware.site www.cubsoftware.site;

    # Logging
    access_log /var/log/nginx/cubsoftware_access.log;
    error_log /var/log/nginx/cubsoftware_error.log;

    # Max upload size for downloads
    client_max_body_size 100M;

    # --- Anti-Slowloris: client-facing timeouts ---
    # These control how long nginx waits for a client to send headers/body.
    # Slowloris exploits servers with no limit here.
    # Normal browsers send headers in milliseconds — 10s only catches bots.
    client_header_timeout 10s;
    client_body_timeout   10s;

    # How long to keep idle keep-alive connections open
    keepalive_timeout 15s;

    # How long nginx waits between successive write operations to the client.
    # Raised to 60s so slow-connection users don't get dropped mid-download.
    send_timeout 60s;

    # --- Per-IP connection and request rate limits ---
    # 100 connections per IP handles offices/universities sharing one IP.
    # 30r/s with burst 60 is far above what any real user generates.
    limit_conn conn_limit_per_ip 100;
    limit_req  zone=req_limit_per_ip burst=60 nodelay;

    # --- Proxy timeouts (backend: nginx -> gunicorn) ---
    # Kept long to support legitimate file downloads
    proxy_connect_timeout 60;
    proxy_send_timeout    600;
    proxy_read_timeout    600;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Static files (optional optimization)
    location /static/ {
        alias /var/www/cubsoftware/website/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
