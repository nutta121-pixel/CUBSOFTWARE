<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5865f2">
    <title>404 - Page Not Found | CUB SOFTWARE</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/images/company-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css?v={{ v }}">
    <link rel="stylesheet" href="/static/css/state-pages.css?v={{ v }}">
</head>
<body>
    <div class="main-container">
        {% include 'header.html' %}

        <div class="state-page">
            <div class="state-card">
                <div class="error-code">404</div>
                <h1 class="state-title">Page Not Found</h1>
                <p class="state-subtitle">
                    This page doesn't exist (yet). You might have a bad link, or we moved something.
                </p>
                <div class="state-actions">
                    <a href="/" class="state-btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Back to Home
                    </a>
                    <a href="/contact" class="state-btn-ghost">
                        Report Broken Link
                    </a>
                </div>
            </div>
        </div>

        {% include 'footer.html' %}
    </div>
</body>
</html>
