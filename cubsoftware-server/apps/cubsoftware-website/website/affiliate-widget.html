<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CUB SOFTWARE Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    background: transparent;
    width: 100%; height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 22px;
    background: rgba(0, 0, 0, 0.72);
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    white-space: nowrap;
    animation: glow 3s ease-in-out infinite;
}

@keyframes glow {
    0%, 100% { box-shadow: 0 0 12px rgba(229, 62, 62, 0.25), 0 2px 16px rgba(0,0,0,0.4); }
    50%       { box-shadow: 0 0 28px rgba(229, 62, 62, 0.55), 0 2px 16px rgba(0,0,0,0.4); }
}

.text {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #e53e3e;
    letter-spacing: 1.5px;
    white-space: nowrap;
}

.sep {
    color: rgba(255, 255, 255, 0.2);
    font-size: 14px;
    flex-shrink: 0;
}
</style>
</head>
<body>
<div class="badge">
    <span class="text">Powered by CUB SOFTWARE</span>
    <span class="sep">·</span>
    <span class="text" style="letter-spacing:1px;">cubsoftware.site/r/{{ affiliate.code }}</span>
</div>
</body>
</html>
