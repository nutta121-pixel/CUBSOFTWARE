<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5865f2">
    <title>Browse Server Templates - CleanMe</title>
    <meta name="description" content="Browse and discover Discord server templates shared by the community. Copy any template to your server with CleanMe bot.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Browse Server Templates - CleanMe">
    <meta property="og:description" content="Browse and discover Discord server templates shared by the community. Copy any template to your server with CleanMe bot.">
    <meta property="og:url" content="https://cubsoftware.site/cleanme/browse">
    <meta property="og:image" content="https://cubsoftware.site/static/images/company-logo.png">
    <meta property="og:site_name" content="CUB SOFTWARE">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Browse Server Templates - CleanMe">
    <meta name="twitter:description" content="Browse and discover Discord server templates shared by the community. Copy any template to your server with CleanMe bot.">
    <meta name="twitter:image" content="https://cubsoftware.site/static/images/company-logo.png">

    <link rel="icon" type="image/png" href="/static/images/cleanme-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css?v={{ v }}">
    <link rel="stylesheet" href="/static/css/cleanme.css?v={{ v }}">
</head>
<body data-page="browse">
    <!-- Header -->
    {% include 'header.html' %}

    <!-- Browse Section -->
    <main class="browse-main">
        <div class="browse-header">
            <h1>Browse Server Templates</h1>
            <p>Discover community-created Discord server templates</p>
        </div>

        <!-- Filters -->
        <div class="browse-filters">
            <form class="search-form">
                <input type="text" name="search" placeholder="Search templates..." value="{{ search or '' }}">
                <button type="submit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="M21 21l-4.35-4.35"></path>
                    </svg>
                </button>
            </form>

            <div class="filter-group">
                <select class="category-filter">
                    <option value="">All Categories</option>
                    <option value="gaming" {% if category == 'gaming' %}selected{% endif %}>Gaming</option>
                    <option value="community" {% if category == 'community' %}selected{% endif %}>Community</option>
                    <option value="education" {% if category == 'education' %}selected{% endif %}>Education</option>
                    <option value="music" {% if category == 'music' %}selected{% endif %}>Music</option>
                    <option value="content" {% if category == 'content' %}selected{% endif %}>Content Creation</option>
                    <option value="business" {% if category == 'business' %}selected{% endif %}>Business</option>
                    <option value="technology" {% if category == 'technology' %}selected{% endif %}>Technology</option>
                    <option value="art" {% if category == 'art' %}selected{% endif %}>Art & Design</option>
                    <option value="other" {% if category == 'other' %}selected{% endif %}>Other</option>
                </select>

                <select class="sort-filter">
                    <option value="popular" {% if sort == 'popular' %}selected{% endif %}>Most Popular</option>
                    <option value="latest" {% if sort == 'latest' %}selected{% endif %}>Latest</option>
                    <option value="votes" {% if sort == 'votes' %}selected{% endif %}>Most Voted</option>
                    <option value="copies" {% if sort == 'copies' %}selected{% endif %}>Most Copied</option>
                </select>
            </div>
        </div>

        <p class="results-count">Loading...</p>

        <!-- Server Grid -->
        <div class="servers-grid browse">
            <!-- Cards loaded via JavaScript -->
        </div>

        <!-- Loading indicator -->
        <div class="loading-more" style="display: none;">
            <div class="spinner"></div>
            <span>Loading more templates...</span>
        </div>
    </main>

    {% include 'footer.html' %}

    <script src="/static/js/cleanme.js?v={{ v }}"></script>
</body>
</html>
