<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CubReactive Overlay</title>
    <link rel="stylesheet" href="/static/css/cubreactive-overlay.css?v={{ cache_bust }}">
</head>
<body>
    <div class="overlay-container position-center" id="overlay-container"></div>
    <div class="status-overlay" id="status-overlay"></div>

    <script>
        // Configuration passed from server
        const MODE = {{ mode | tojson }};
        const TARGET_USER_ID = {{ (target_user_id or '') | tojson }};
        const USER_CONFIG = {{ user_config | tojson }};

        // API base URL
        const API_BASE = window.location.origin;

        // WebSocket URL for CubReactive bot
        const WS_URL = {{ ws_url | tojson }};
    </script>
    <script src="/static/js/cubreactive-overlay.js?v={{ cache_bust }}"></script>
    <!-- Config updates are handled via WebSocket CONFIG_UPDATED events - no polling needed -->
</body>
</html>
