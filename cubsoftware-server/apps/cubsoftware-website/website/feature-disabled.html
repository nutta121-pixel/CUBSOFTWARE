<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f59e0b">
    <title>Feature Disabled - CUB SOFTWARE</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/static/images/company-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css?v={{ v }}">
    <link rel="stylesheet" href="/static/css/state-pages.css?v={{ v }}">
</head>
<body class="state-glow-amber">
    <div class="state-page-full">
        <div class="state-card">
            <div class="state-icon state-icon-amber">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>

            <h1 class="state-title state-title-amber">Feature Disabled</h1>
            <p class="state-subtitle">This feature is currently unavailable.</p>

            <div class="feature-name-box">
                <div class="label">Feature</div>
                <div class="value">{{ feature.replace('-', ' ') }}</div>
            </div>

            <p class="state-subtitle" style="font-size:0.9rem;">
                This feature has been temporarily disabled for maintenance or updates.
                Please check back later or explore our other available tools.
            </p>

            <div class="state-actions">
                <a href="/" class="state-btn-primary">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"/>
                        <polyline points="12 19 5 12 12 5"/>
                    </svg>
                    Back to Home
                </a>
                <a href="/contact" class="state-btn-ghost">Contact Us</a>
            </div>
        </div>
    </div>
</body>
</html>
