<!-- Cookie Consent Banner -->
<div class="cookie-banner" id="cookieBanner" role="dialog" aria-label="Cookie consent">
    <div class="cookie-banner-inner">
        <div class="cookie-banner-text">
            <p>We use cookies to keep you logged in, remember your preferences, and improve your experience. By clicking <strong>Accept</strong> you agree to our use of cookies as described in our <a href="/privacy">Privacy Policy</a>.</p>
        </div>
        <div class="cookie-banner-actions">
            <button class="cookie-btn-accept" onclick="cookieConsent('accept')">Accept</button>
            <button class="cookie-btn-decline" onclick="cookieConsent('decline')">Decline</button>
        </div>
    </div>
</div>

<script>
(function () {
    var KEY = 'cub_cookie_consent';
    var banner = document.getElementById('cookieBanner');
    if (!banner) return;
    if (!localStorage.getItem(KEY)) {
        setTimeout(function () { banner.classList.add('visible'); }, 300);
    }
    window.cookieConsent = function (choice) {
        localStorage.setItem(KEY, choice);
        banner.classList.remove('visible');
    };
})();
</script>
