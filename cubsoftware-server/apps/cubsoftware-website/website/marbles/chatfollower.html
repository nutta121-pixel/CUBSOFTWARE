<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marbles Chat Follower</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 320px;
            background: transparent;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #feed {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px;
        }

        .entry {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            background: rgba(5,5,12,0.82);
            border-left: 3px solid currentColor;
            border-radius: 0 5px 5px 0;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .name {
            font-size: 13px;
            font-weight: 600;
            color: #e0e0e0;
            flex: 1;
        }

        .action {
            font-size: 10px;
            color: #888;
            white-space: nowrap;
        }

        .action.joined { color: #22c55e; }
    </style>
</head>
<body>
<div id="feed"></div>

<script>
const SESSION_ID = location.pathname.split('/').pop();
const MAX_ENTRIES = 8;
const seen = new Set();

function colourFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return `hsl(${h},60%,60%)`;
}

function addEntry(name, action) {
    const colour = colourFor(name);
    const feed = document.getElementById('feed');
    const el = document.createElement('div');
    el.className = 'entry';
    el.style.color = colour;
    el.innerHTML = `
        <div class="dot" style="background:${colour}"></div>
        <span class="name">${name}</span>
        <span class="action ${action === 'joined' ? 'joined' : ''}">${action === 'joined' ? '✓ joined!' : action}</span>
    `;
    feed.insertBefore(el, feed.firstChild);

    // Cap feed length
    while (feed.children.length > MAX_ENTRIES) {
        feed.removeChild(feed.lastChild);
    }

    // Fade and remove after 8 seconds
    setTimeout(() => {
        el.style.transition = 'opacity 0.5s, transform 0.5s';
        el.style.opacity = '0';
        el.style.transform = 'translateX(-12px)';
        setTimeout(() => el.remove(), 500);
    }, 8000);

    // Update body height
    document.body.style.height = feed.offsetHeight + 'px';
}

let lastCount = 0;

async function refresh() {
    try {
        const res = await fetch(`/marbles/api/game/${SESSION_ID}`);
        if (!res.ok) return;
        const data = await res.json();
        const players = data.players || [];

        // Detect newly joined players
        players.forEach(name => {
            if (!seen.has(name)) {
                seen.add(name);
                if (lastCount > 0) {
                    // Only show entries after initial load (don't spam on page load)
                    addEntry(name, 'joined');
                }
            }
        });

        // After first poll, set baseline
        lastCount = players.length;
    } catch {}
}

// First poll to set baseline without showing entries
fetch(`/marbles/api/game/${SESSION_ID}`)
    .then(r => r.ok ? r.json() : null)
    .then(data => {
        if (data) {
            (data.players || []).forEach(p => seen.add(p));
            lastCount = seen.size;
        }
    })
    .catch(() => {})
    .finally(() => {
        setInterval(refresh, 2000);
    });
</script>
</body>
</html>
