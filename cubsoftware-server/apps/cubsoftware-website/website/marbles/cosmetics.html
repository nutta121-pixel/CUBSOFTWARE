<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmetics — Marbles | CUBSOFTWARE</title>
    <link rel="icon" type="image/png" href="/static/images/company-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css?v={{ v }}">
    <style>
        body { background:#050508; color:#e0e0e0; font-family:'Poppins',sans-serif; }
        .c-wrap  { max-width:860px; margin:0 auto; padding:40px 20px; }
        .c-back  { font-size:12px; color:#555; text-decoration:none; display:inline-flex; align-items:center; gap:4px; margin-bottom:20px; }
        .c-back:hover { color:#5865f2; }
        .c-title { font-family:'Orbitron',sans-serif; font-size:22px; font-weight:900; color:#fff; margin-bottom:6px; }
        .c-sub   { font-size:12px; color:#555; margin-bottom:32px; }

        /* Tab nav */
        .c-tabs  { display:flex; gap:4px; margin-bottom:28px; border-bottom:1px solid #1e1e2e; }
        .c-tab   { padding:8px 18px; font-size:12px; font-weight:600; color:#555; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s; background:none; border-top:none; border-left:none; border-right:none; }
        .c-tab:hover { color:#c0c0d0; }
        .c-tab.active { color:#5865f2; border-bottom-color:#5865f2; }

        /* Preview ball */
        .c-preview {
            display:flex; justify-content:center; margin-bottom:28px;
        }
        .c-preview canvas {
            width:120px; height:120px; border-radius:50%;
            box-shadow:0 0 30px rgba(88,101,242,0.3);
        }

        /* Grid of cosmetic cards */
        .c-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
            gap:10px;
        }
        .c-card {
            background:#0d0d1a; border:1px solid #1e1e2e; border-radius:10px;
            padding:12px 8px 10px; text-align:center; cursor:pointer;
            transition:border-color 0.15s, box-shadow 0.15s;
            position:relative;
        }
        .c-card:hover { border-color:#5865f2; }
        .c-card.equipped { border-color:#5865f2; box-shadow:0 0 12px rgba(88,101,242,0.35); }
        .c-card.locked { opacity:0.38; cursor:default; }
        .c-card.locked:hover { border-color:#1e1e2e; }

        .c-card-preview { width:56px; height:56px; border-radius:50%; margin:0 auto 8px; display:block; }
        .c-card-name  { font-size:11px; font-weight:700; color:#e0e0e0; margin-bottom:3px; }
        .c-card-unlock { font-size:9px; color:#555; line-height:1.3; }
        .c-card.equipped .c-card-unlock { color:#5865f2; }

        .c-lock-icon {
            position:absolute; top:6px; right:7px; font-size:12px; opacity:0.5;
        }
        .c-equipped-badge {
            position:absolute; top:6px; right:7px; font-size:10px; color:#5865f2;
        }

        /* Accessory trail previews */
        .c-card-trail {
            width:56px; height:56px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;
            font-size:28px;
        }

        .c-toast {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
            background:#5865f2; color:#fff; padding:9px 20px; border-radius:8px;
            font-size:13px; font-weight:600; pointer-events:none;
            opacity:0; transition:opacity 0.2s;
        }
        .c-toast.show { opacity:1; }

        .c-section-title {
            display:none;
        }
        .c-section-title.active {
            display:block; font-family:'Orbitron',sans-serif; font-size:11px; color:#5865f2;
            text-transform:uppercase; letter-spacing:0.12em; margin-bottom:16px;
        }
    </style>
</head>
<body>
<div class="c-wrap">
    <a class="c-back" href="/marbles/player/{{ login }}">← Back to Profile</a>
    <div class="c-title">🎨 Cosmetics</div>
    <div class="c-sub">Customise your marble — skins, trails, and accessories. Equip anything you've unlocked.</div>

    <div class="c-preview">
        <canvas id="previewCanvas" width="120" height="120"></canvas>
    </div>

    <div class="c-tabs">
        <button class="c-tab active" onclick="switchTab('skins')">🪩 Skins <span id="skinUnlockCount"></span></button>
        <button class="c-tab" onclick="switchTab('trails')">✨ Trails <span id="trailUnlockCount"></span></button>
        <button class="c-tab" onclick="switchTab('accessories')">🎩 Accessories <span id="accUnlockCount"></span></button>
    </div>

    <div id="tabSkins">
        <div class="c-grid" id="skinsGrid"></div>
    </div>
    <div id="tabTrails" style="display:none">
        <div class="c-grid" id="trailsGrid"></div>
    </div>
    <div id="tabAccessories" style="display:none">
        <div class="c-grid" id="accessoriesGrid"></div>
    </div>
</div>

<div class="c-toast" id="toast"></div>

<script>
const LOGIN      = {{ login | tojson }};
const COSMETICS  = {{ cosmetics | tojson }};
const CATALOGUE  = {{ catalogue | tojson }};

let currentTab    = 'skins';
let equipped      = {
    skin:      COSMETICS.equipped_skin      || 'solid',
    trail:     COSMETICS.equipped_trail     || 'none',
    accessory: COSMETICS.equipped_accessory || 'none',
};
const unlocked = {
    skin:      new Set(COSMETICS.unlocked_skins),
    trail:     new Set(COSMETICS.unlocked_trails),
    accessory: new Set(COSMETICS.unlocked_accessories),
};

// ── Preview ball renderer ──────────────────────────────────────────────────
const previewCanvas = document.getElementById('previewCanvas');
const ctx = previewCanvas.getContext('2d');

const MARBLE_COLOR = '#' + Math.abs(LOGIN.split('').reduce((h,c)=>((h<<5)-h)+c.charCodeAt(0)|0,0)).toString(16).padStart(6,'0').slice(-6);

function drawPreviewSkin(skinKey) {
    const W = 120, H = 120, R = 58;
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.beginPath();
    ctx.arc(W/2,H/2,R,0,Math.PI*2);
    ctx.clip();
    _drawSkin(ctx, skinKey, W, H, MARBLE_COLOR);
    // Specular highlight
    const grad = ctx.createRadialGradient(W*0.38, H*0.32, 2, W/2, H/2, R);
    grad.addColorStop(0, 'rgba(255,255,255,0.5)');
    grad.addColorStop(0.4, 'rgba(255,255,255,0.05)');
    grad.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
}

function _drawSkin(ctx, key, W, H, color) {
    switch(key) {
        case 'solid':
        default:
            ctx.fillStyle = color;
            ctx.fillRect(0,0,W,H);
            break;
        case 'striped': {
            ctx.fillStyle = color;
            ctx.fillRect(0,0,W,H);
            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            for (let i = -H; i < W+H; i += 20) {
                ctx.fillRect(i,0,10,H*2);
            }
            // rotate 45
            ctx.clearRect(0,0,W,H);
            ctx.save();
            ctx.translate(W/2,H/2); ctx.rotate(-Math.PI/4); ctx.translate(-W/2,-H/2);
            ctx.fillStyle = color; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for (let i = -H; i < W+H; i += 18) { ctx.fillRect(i,0,9,H+W); }
            ctx.restore();
            break;
        }
        case 'polka_dot': {
            ctx.fillStyle = color; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            for (let y = 10; y < H; y += 20) for (let x = 10; x < W; x += 20) {
                ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
            }
            break;
        }
        case 'checker': {
            const sq = 14;
            for (let y = 0; y < H; y += sq) for (let x = 0; x < W; x += sq) {
                ctx.fillStyle = (Math.floor(x/sq)+Math.floor(y/sq))%2===0 ? color : '#111';
                ctx.fillRect(x,y,sq,sq);
            }
            break;
        }
        case 'swirl': {
            const grad = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W/2);
            grad.addColorStop(0,'#fff'); grad.addColorStop(0.4, color); grad.addColorStop(1,'#111');
            ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'galaxy': case 'nebula': {
            const bg = key==='galaxy' ? '#060618' : '#1a0630';
            ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
            // stars
            const rng = (n) => { let h=n; h=((h>>16)^h)*0x45d9f3b; h=((h>>16)^h)*0x45d9f3b; return ((h>>16)^h)&0xff; };
            for(let i=0;i<80;i++){
                const sx=rng(i*7)%W, sy=rng(i*13)%H, sr=rng(i*3)%2+0.5;
                ctx.fillStyle=`rgba(255,255,255,${(rng(i*17)%60+40)/100})`;
                ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
            }
            // nebula cloud
            const c1 = key==='galaxy' ? 'rgba(88,101,242,0.5)' : 'rgba(200,80,242,0.5)';
            const ng = ctx.createRadialGradient(W*0.55,H*0.4,4,W*0.5,H*0.5,W*0.5);
            ng.addColorStop(0,c1); ng.addColorStop(1,'transparent');
            ctx.fillStyle=ng; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'lava': {
            const lg = ctx.createRadialGradient(W*0.4,H*0.4,5,W/2,H/2,W*0.6);
            lg.addColorStop(0,'#ffdd00'); lg.addColorStop(0.4,'#ff4400'); lg.addColorStop(1,'#1a0000');
            ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'ice': {
            const ig = ctx.createRadialGradient(W*0.38,H*0.38,4,W/2,H/2,W*0.55);
            ig.addColorStop(0,'#e8f8ff'); ig.addColorStop(0.5,'#7ec8e3'); ig.addColorStop(1,'#003060');
            ctx.fillStyle=ig; ctx.fillRect(0,0,W,H);
            // crystal lines
            ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1;
            for(let a=0;a<6;a++){
                ctx.beginPath(); ctx.moveTo(W/2,H/2);
                const ang=a*Math.PI/3; ctx.lineTo(W/2+Math.cos(ang)*50,H/2+Math.sin(ang)*50);
                ctx.stroke();
            }
            break;
        }
        case 'ocean': {
            const og = ctx.createLinearGradient(0,0,0,H);
            og.addColorStop(0,'#006994'); og.addColorStop(1,'#00264d');
            ctx.fillStyle=og; ctx.fillRect(0,0,W,H);
            ctx.strokeStyle='rgba(100,200,255,0.25)'; ctx.lineWidth=2;
            for(let y=0;y<H;y+=12){ ctx.beginPath(); ctx.moveTo(0,y+4*Math.sin(y*0.3)); ctx.bezierCurveTo(W/3,y-4,W*2/3,y+4,W,y+2*Math.sin(y*0.2+1)); ctx.stroke(); }
            break;
        }
        case 'forest': {
            const fg = ctx.createLinearGradient(0,0,0,H);
            fg.addColorStop(0,'#1a4a1a'); fg.addColorStop(1,'#0a2a0a');
            ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
            ctx.fillStyle='rgba(60,180,60,0.3)';
            for(let i=0;i<12;i++){ ctx.beginPath(); ctx.arc(i*11,H*0.7+Math.sin(i)*6,8,0,Math.PI*2); ctx.fill(); }
            break;
        }
        case 'gold': {
            const gg = ctx.createRadialGradient(W*0.38,H*0.38,2,W/2,H/2,W*0.55);
            gg.addColorStop(0,'#fffacd'); gg.addColorStop(0.4,'#ffd700'); gg.addColorStop(1,'#a67c00');
            ctx.fillStyle=gg; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'silver': {
            const sg = ctx.createRadialGradient(W*0.38,H*0.38,2,W/2,H/2,W*0.55);
            sg.addColorStop(0,'#ffffff'); sg.addColorStop(0.4,'#c0c0c0'); sg.addColorStop(1,'#505050');
            ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'diamond': {
            const dg = ctx.createRadialGradient(W*0.35,H*0.35,2,W/2,H/2,W*0.6);
            dg.addColorStop(0,'#ffffff'); dg.addColorStop(0.2,'#b9f2ff'); dg.addColorStop(0.6,'#0070a0'); dg.addColorStop(1,'#001820');
            ctx.fillStyle=dg; ctx.fillRect(0,0,W,H);
            // facet lines
            ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1;
            [[0,0,W/2,H/2],[W,0,W/2,H/2],[0,H,W/2,H/2],[W,H,W/2,H/2],[W/2,0,W/2,H/2],[0,H/2,W/2,H/2],[W,H/2,W/2,H/2],[W/2,H,W/2,H/2]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
            break;
        }
        case 'obsidian': {
            const ob = ctx.createRadialGradient(W*0.38,H*0.35,2,W/2,H/2,W*0.55);
            ob.addColorStop(0,'#555'); ob.addColorStop(0.5,'#1a1a2e'); ob.addColorStop(1,'#000');
            ctx.fillStyle=ob; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'holographic': {
            const hg = ctx.createLinearGradient(0,0,W,H);
            hg.addColorStop(0,'#ff0088'); hg.addColorStop(0.25,'#ffaa00'); hg.addColorStop(0.5,'#00ff88');
            hg.addColorStop(0.75,'#0088ff'); hg.addColorStop(1,'#cc00ff');
            ctx.fillStyle=hg; ctx.fillRect(0,0,W,H);
            ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'neon': {
            ctx.fillStyle='#111'; ctx.fillRect(0,0,W,H);
            const ng2 = ctx.createRadialGradient(W/2,H/2,4,W/2,H/2,W*0.5);
            ng2.addColorStop(0,'rgba(0,255,180,0.9)'); ng2.addColorStop(0.5,'rgba(0,180,255,0.5)'); ng2.addColorStop(1,'transparent');
            ctx.fillStyle=ng2; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'rainbow': {
            const rg = ctx.createLinearGradient(0,0,W,H);
            rg.addColorStop(0,'#ff0000'); rg.addColorStop(0.17,'#ff8800'); rg.addColorStop(0.33,'#ffff00');
            rg.addColorStop(0.5,'#00ff00'); rg.addColorStop(0.67,'#0088ff'); rg.addColorStop(0.83,'#8800ff'); rg.addColorStop(1,'#ff0088');
            ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'emoji': {
            ctx.fillStyle=color; ctx.fillRect(0,0,W,H);
            ctx.font='60px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText('😄',W/2,H/2);
            break;
        }
        case 'transparent': {
            // Checkered "transparent" pattern
            const cq=16;
            for(let cy=0;cy<H;cy+=cq) for(let cx=0;cx<W;cx+=cq){
                ctx.fillStyle=(Math.floor(cx/cq)+Math.floor(cy/cq))%2===0?'#ccc':'#888';
                ctx.fillRect(cx,cy,cq,cq);
            }
            ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'fire': {
            const fr = ctx.createRadialGradient(W/2,H*0.7,2,W/2,H/2,W*0.55);
            fr.addColorStop(0,'#ffff00'); fr.addColorStop(0.35,'#ff6600'); fr.addColorStop(0.7,'#cc0000'); fr.addColorStop(1,'#1a0000');
            ctx.fillStyle=fr; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'void': {
            ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
            const vg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.5);
            vg.addColorStop(0,'rgba(40,0,80,0.8)'); vg.addColorStop(0.5,'rgba(10,0,30,0.5)'); vg.addColorStop(1,'transparent');
            ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
            break;
        }
        case 'pizza': {
            ctx.fillStyle='#e8c06a'; ctx.fillRect(0,0,W,H);
            ctx.fillStyle='#cc2200'; ctx.beginPath(); ctx.arc(W/2,H/2,40,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#ffaa00'; ['🧀','🫑','🍅'].forEach((e,i)=>{
                ctx.font='18px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
                const a=i*Math.PI*2/3; ctx.fillText(e,W/2+Math.cos(a)*20,H/2+Math.sin(a)*20);
            });
            break;
        }
        case 'dirt': {
            // Minecraft dirt pixelated look
            ctx.fillStyle='#7a4c18'; ctx.fillRect(0,0,W,H);
            const pixels=['rgba(0,0,0,0.3)','rgba(255,255,255,0.15)','rgba(100,60,10,0.4)'];
            const pr=10;
            for(let py=0;py<H;py+=pr) for(let px=0;px<W;px+=pr){
                const v=(px*13+py*7+px*py)%3;
                ctx.fillStyle=pixels[v]; ctx.fillRect(px,py,pr,pr);
            }
            break;
        }
        case 'flag': {
            // Simple tricolour flag
            ctx.fillStyle='#002395'; ctx.fillRect(0,0,W/3,H);
            ctx.fillStyle='#ffffff'; ctx.fillRect(W/3,0,W/3,H);
            ctx.fillStyle='#ed2939'; ctx.fillRect(W*2/3,0,W/3,H);
            break;
        }
    }
}

const TRAIL_ICONS = {
    none:'—', classic:'〰️', sparkle:'✨', fire_trail:'🔥', rainbow_trail:'🌈',
    smoke:'💨', lightning:'⚡', hearts:'❤️', stars:'⭐', bubbles:'🫧',
    money:'💰', cherry:'🌸', dark_matter:'🌑', ice_crystals:'❄️', lava_drip:'🌋', dna:'🧬'
};
const ACCESSORY_ICONS = {
    none:'—', crown:'👑', halo:'😇', party_hat:'🎉', bow:'🎀',
    propeller:'🚁', wings:'🕊️', sunglasses:'😎'
};

function buildCards(items, type) {
    const grid = document.getElementById(type === 'skin' ? 'skinsGrid' : type === 'trail' ? 'trailsGrid' : 'accessoriesGrid');
    grid.innerHTML = '';
    let unlockedCount = 0;
    items.forEach(item => {
        const isUnlocked = unlocked[type].has(item.key);
        const isEquipped = equipped[type] === item.key;
        if (isUnlocked) unlockedCount++;

        const card = document.createElement('div');
        card.className = 'c-card' + (isEquipped ? ' equipped' : '') + (isUnlocked ? '' : ' locked');
        card.title = isUnlocked ? item.name : `Locked — ${item.unlock}`;

        let preview = '';
        if (type === 'skin') {
            const cv = document.createElement('canvas');
            cv.width = cv.height = 56;
            cv.className = 'c-card-preview';
            const c = cv.getContext('2d');
            c.save(); c.beginPath(); c.arc(28,28,27,0,Math.PI*2); c.clip();
            _drawSkin(c, item.key, 56, 56, MARBLE_COLOR);
            c.restore();
            preview = cv.outerHTML;
        } else {
            const icon = type === 'trail' ? (TRAIL_ICONS[item.key]||'?') : (ACCESSORY_ICONS[item.key]||'?');
            preview = `<div class="c-card-trail">${icon}</div>`;
        }

        card.innerHTML = `
            ${preview}
            <div class="c-card-name">${item.name}</div>
            <div class="c-card-unlock">${isEquipped ? '✓ Equipped' : isUnlocked ? 'Unlocked' : item.unlock}</div>
            ${isEquipped ? '<span class="c-equipped-badge">✓</span>' : (!isUnlocked ? '<span class="c-lock-icon">🔒</span>' : '')}
        `;

        if (isUnlocked && !isEquipped) {
            card.addEventListener('click', () => equipItem(type, item.key));
        }
        grid.appendChild(card);
    });
    return { total: items.length, unlocked: unlockedCount };
}

async function equipItem(type, key) {
    try {
        const res = await fetch(`/marbles/api/player/${LOGIN}/cosmetics/equip`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type, key }),
        });
        if (!res.ok) { showToast('Could not equip item', true); return; }
        equipped[type] = key;
        buildCards(type === 'skin' ? CATALOGUE.skins : type === 'trail' ? CATALOGUE.trails : CATALOGUE.accessories, type);
        if (type === 'skin') drawPreviewSkin(key);
        showToast(`Equipped "${key.replace(/_/g,' ')}"!`);
    } catch { showToast('Error', true); }
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.c-tab').forEach((t,i) => t.classList.toggle('active', ['skins','trails','accessories'][i]===tab));
    document.getElementById('tabSkins').style.display       = tab==='skins'       ? '' : 'none';
    document.getElementById('tabTrails').style.display      = tab==='trails'      ? '' : 'none';
    document.getElementById('tabAccessories').style.display = tab==='accessories' ? '' : 'none';
}

function showToast(msg, err=false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = err ? '#ef4444' : '#5865f2';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
}

// Initialise
const sc = buildCards(CATALOGUE.skins,       'skin');
const tc = buildCards(CATALOGUE.trails,      'trail');
const ac = buildCards(CATALOGUE.accessories, 'accessory');
document.getElementById('skinUnlockCount').textContent  = `(${sc.unlocked}/${sc.total})`;
document.getElementById('trailUnlockCount').textContent = `(${tc.unlocked}/${tc.total})`;
document.getElementById('accUnlockCount').textContent   = `(${ac.unlocked}/${ac.total})`;
drawPreviewSkin(equipped.skin);

// Replace canvas preview card HTML with real canvas elements (innerHTML loses canvas data)
// Re-draw skin cards after insert
document.querySelectorAll('#skinsGrid .c-card').forEach((card, i) => {
    const cv = card.querySelector('canvas.c-card-preview');
    if (!cv) return;
    const key = CATALOGUE.skins[i]?.key;
    if (!key) return;
    const c = cv.getContext('2d');
    c.save(); c.beginPath(); c.arc(28,28,27,0,Math.PI*2); c.clip();
    _drawSkin(c, key, 56, 56, MARBLE_COLOR);
    c.restore();
});
</script>
