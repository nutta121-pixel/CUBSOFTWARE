<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Leaderboard — CUBSOFTWARE</title>
    <link rel="icon" type="image/png" href="/static/images/company-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css?v={{ v }}">
    <style>
        body { background:#050508; color:#e0e0e0; font-family:'Poppins',sans-serif; }
        .lb-wrap { max-width:760px; margin:0 auto; padding:40px 20px 60px; }

        .lb-back { font-size:12px; color:#555; text-decoration:none; display:inline-flex; align-items:center; gap:5px; margin-bottom:20px; }
        .lb-back:hover { color:#5865f2; }

        .lb-title { font-family:'Orbitron',sans-serif; font-size:24px; font-weight:900; color:#fff; margin-bottom:4px; }
        .lb-mapid { font-size:10px; color:#444; margin-bottom:6px; font-family:monospace; }
        .lb-sub { font-size:13px; color:#666; margin-bottom:28px; }

        .lb-table { width:100%; border-collapse:collapse; }
        .lb-table th {
            text-align:left; padding:8px 12px; font-size:10px; font-weight:700;
            color:#555; text-transform:uppercase; letter-spacing:0.1em;
            border-bottom:1px solid #1e1e2e;
        }
        .lb-table td { padding:10px 12px; border-bottom:1px solid #111; font-size:13px; }
        .lb-table tr:hover td { background:#0d0d1a; }

        .rank-cell { width:40px; font-weight:700; color:#888; }
        .rank-cell.gold   { color:#fbbf24; }
        .rank-cell.silver { color:#94a3b8; }
        .rank-cell.bronze { color:#b45309; }

        .name-cell { display:flex; align-items:center; gap:8px; }
        .name-dot  { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .name-link { color:#e0e0e0; text-decoration:none; font-weight:600; }
        .name-link:hover { color:#5865f2; }

        .time-cell { font-weight:700; color:#22c55e; font-family:'Orbitron',sans-serif; font-size:12px; }
        .attempts-cell { color:#555; font-size:11px; }

        .empty { padding:60px 20px; text-align:center; color:#444; font-size:13px; }
        .record-badge {
            display:inline-flex; align-items:center; gap:4px;
            background:#fbbf2420; border:1px solid #fbbf2440;
            color:#fbbf24; font-size:10px; font-weight:700;
            padding:2px 7px; border-radius:4px; margin-left:8px;
        }
    </style>
</head>
<body>

<div class="lb-wrap">
    <a href="/marbles/leaderboard" class="lb-back">← Global Leaderboard</a>

    <div class="lb-title" id="mapTitle">Map Leaderboard</div>
    <div class="lb-mapid" id="mapId"></div>
    <div class="lb-sub" id="mapSub">Loading…</div>

    <table class="lb-table">
        <thead>
            <tr>
                <th class="rank-cell">#</th>
                <th>Player</th>
                <th>Best Time</th>
                <th>Attempts</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="4" class="empty">Loading…</td></tr>
        </tbody>
    </table>
</div>

<script>
const mapId = location.pathname.split('/').pop();
document.getElementById('mapId').textContent = mapId;

function colourFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return `hsl(${h},60%,60%)`;
}

function formatMs(ms) {
    if (!ms) return '—';
    const s = ms / 1000;
    const m = Math.floor(s / 60);
    const sec = (s % 60).toFixed(3);
    return m > 0 ? `${m}:${sec.padStart(6,'0')}` : `${sec}s`;
}

const MEDAL_CLASS = ['gold', 'silver', 'bronze'];

async function load() {
    const res = await fetch(`/marbles/api/leaderboard/map/${mapId}`);
    if (!res.ok) { document.getElementById('mapSub').textContent = 'Map not found.'; return; }
    const data = await res.json();

    document.getElementById('mapTitle').textContent = data.map_name || 'Map Leaderboard';
    const entries = data.entries || [];
    document.getElementById('mapSub').textContent =
        entries.length ? `${entries.length} player${entries.length === 1 ? '' : 's'} have completed this map` : 'No completions yet.';

    const tbody = document.getElementById('tableBody');
    if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No times recorded for this map yet.</td></tr>';
        return;
    }

    tbody.innerHTML = entries.map((e, i) => {
        const rank  = i + 1;
        const medal = rank <= 3 ? MEDAL_CLASS[rank - 1] : '';
        const name  = e.twitch_login;
        const col   = colourFor(name);
        const isRecord = rank === 1;
        return `<tr>
            <td class="rank-cell ${medal}">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank}</td>
            <td>
                <div class="name-cell">
                    <div class="name-dot" style="background:${col}"></div>
                    <a href="/marbles/player/${name}" class="name-link">${name}</a>
                    ${isRecord ? '<span class="record-badge">🏆 Record</span>' : ''}
                </div>
            </td>
            <td class="time-cell">${formatMs(e.best_time_ms)}</td>
            <td class="attempts-cell">${e.attempts} run${e.attempts === 1 ? '' : 's'}</td>
        </tr>`;
    }).join('');
}

load();
</script>

</body>
</html>
