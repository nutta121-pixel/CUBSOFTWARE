<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Library — CUBSOFTWARE</title>
    <link rel="icon" type="image/png" href="/static/images/company-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css?v={{ v }}">
    <style>
        body { background:#050508; color:#e0e0e0; font-family:'Poppins',sans-serif; }
        .ml-wrap { max-width:960px; margin:0 auto; padding:40px 20px 60px; }

        .ml-back { font-size:12px; color:#555; text-decoration:none; display:inline-flex; align-items:center; gap:5px; margin-bottom:20px; }
        .ml-back:hover { color:#5865f2; }

        .ml-header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
        .ml-title { font-family:'Orbitron',sans-serif; font-size:26px; font-weight:900; color:#fff; }
        .ml-sub   { font-size:13px; color:#555; margin-top:4px; }

        .ml-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
        .ml-search input {
            background:#0d0d14; border:1px solid #2a2a3a; color:#e0e0e0;
            border-radius:8px; padding:7px 12px; font-size:13px; width:220px;
            font-family:'Poppins',sans-serif; outline:none;
        }
        .ml-search input:focus { border-color:#5865f2; }
        .ml-search input::placeholder { color:#444; }

        .ml-tags-bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
        .ml-tags-bar-label { font-size:11px; color:#555; }
        .ml-tag-btn {
            padding:3px 10px; border-radius:20px; border:1px solid #2a2a3a;
            background:#0d0d14; color:#666; font-size:11px; cursor:pointer;
            font-family:'Poppins',sans-serif; transition:all 0.12s;
        }
        .ml-tag-btn:hover  { border-color:#5865f2; color:#818cf8; }
        .ml-tag-btn.active { background:#5865f220; border-color:#5865f2; color:#818cf8; }

        .ml-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }

        .ml-card {
            background:#0d0d14; border:1px solid #1e1e2e; border-radius:10px;
            padding:14px 16px; display:flex; flex-direction:column; gap:8px;
            transition:border-color 0.15s;
        }
        .ml-card:hover { border-color:#3a3a5a; }

        .ml-card-name { font-size:14px; font-weight:700; color:#e0e0e0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ml-card-desc { font-size:11px; color:#555; min-height:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ml-card-meta { font-size:11px; color:#444; display:flex; gap:10px; flex-wrap:wrap; }
        .ml-card-meta span { display:flex; align-items:center; gap:3px; }

        .ml-thumb {
            width:100%; height:120px; border-radius:6px; overflow:hidden;
            background:#0a0a12; border:1px solid #1a1a2a; margin-bottom:2px;
            display:flex; align-items:center; justify-content:center;
        }
        .ml-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
        .ml-thumb-placeholder { font-size:28px; color:#222; }

        .ml-card-tags { display:flex; gap:4px; flex-wrap:wrap; }
        .ml-tag {
            padding:2px 8px; border-radius:20px; background:#1a1a2a; border:1px solid #2a2a3a;
            font-size:10px; color:#666; cursor:pointer;
        }
        .ml-tag:hover { border-color:#5865f2; color:#818cf8; }

        .ml-card-actions { display:flex; gap:6px; margin-top:4px; }
        .ml-btn {
            flex:1; padding:7px 10px; border-radius:6px; border:1px solid #2a2a3a;
            background:#16161f; color:#aaa; font-size:11px; font-weight:600;
            cursor:pointer; font-family:'Poppins',sans-serif; transition:background 0.12s, color 0.12s;
            text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:5px;
        }
        .ml-btn:hover   { background:#1e1e2e; color:#e0e0e0; }
        .ml-btn.primary { background:#5865f220; border-color:#5865f240; color:#818cf8; }
        .ml-btn.primary:hover { background:#5865f230; color:#a5b4fc; }
        .ml-vote-btn { flex:none; padding:6px 10px; min-width:0; gap:3px; }
        .ml-vote-btn.up   { color:#22c55e; border-color:#22c55e30; }
        .ml-vote-btn.up:hover   { background:#22c55e18; }
        .ml-vote-btn.down { color:#ef4444; border-color:#ef444430; }
        .ml-vote-btn.down:hover { background:#ef444418; }

        .ml-empty { padding:60px 20px; text-align:center; color:#444; font-size:13px; }
        .ml-author { color:#666; }
        .ml-author a { color:#5865f2; text-decoration:none; }
        .ml-author a:hover { text-decoration:underline; }

        .ml-featured-section { margin-bottom:28px; }
        .ml-section-label { font-size:11px; font-weight:700; letter-spacing:0.12em; color:#f59e0b; text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
        .ml-card.featured { border-color:#f59e0b40; background:linear-gradient(135deg,#0d0d14,#1a1600); }
        .ml-card.featured:hover { border-color:#f59e0b80; }
        .ml-featured-badge { position:absolute; top:6px; right:6px; background:#f59e0b; color:#000; font-size:9px; font-weight:800; padding:2px 6px; border-radius:10px; letter-spacing:0.05em; }
    </style>
</head>
<body>

<div class="ml-wrap">
    <a href="/apps/marble-editor" class="ml-back">← Map Editor</a>

    <div class="ml-header">
        <div>
            <div class="ml-title">Map Library</div>
            <div class="ml-sub" id="mlSub">Loading…</div>
        </div>
        <div class="ml-search">
            <input type="text" id="mlSearch" placeholder="Search maps…" oninput="filterMaps()">
        </div>
    </div>

    <div class="ml-tags-bar" id="mlTagsBar" style="display:none;">
        <span class="ml-tags-bar-label">Filter:</span>
    </div>

    <div class="ml-featured-section" id="mlFeaturedSection" style="display:none;">
        <div class="ml-section-label">⭐ Featured Maps</div>
        <div class="ml-grid" id="mlFeaturedGrid"></div>
    </div>

    <div class="ml-grid" id="mlGrid">
        <div style="grid-column:1/-1;" class="ml-empty">Loading…</div>
    </div>
</div>

<script>
let _allMaps = [];
let _activeTag = '';

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

function parseTags(tagStr) {
    return (tagStr || '').split(',').map(t => t.trim()).filter(Boolean);
}

function renderCard(m, featured) {
    const thumb = m.thumbnail
        ? `<div class="ml-thumb"><img src="${esc(m.thumbnail)}" alt=""></div>`
        : `<div class="ml-thumb"><span class="ml-thumb-placeholder">🗺️</span></div>`;
    const tags = parseTags(m.tags);
    const tagHtml = tags.length
        ? `<div class="ml-card-tags">${tags.map(t => `<span class="ml-tag" onclick="setTagFilter('${esc(t)}')">${esc(t)}</span>`).join('')}</div>`
        : '';
    const up   = m.upvotes   || 0;
    const down = m.downvotes || 0;
    const mapId = esc(m.map_id);
    const featBadge = featured ? `<span class="ml-featured-badge">FEATURED</span>` : '';
    return `
    <div class="ml-card${featured ? ' featured' : ''}" style="${featured ? 'position:relative;' : ''}">
        ${featBadge}
        ${thumb}
        <div class="ml-card-name" title="${esc(m.name)}">${esc(m.name)}</div>
        ${m.description ? `<div class="ml-card-desc" title="${esc(m.description)}">${esc(m.description)}</div>` : '<div class="ml-card-desc"></div>'}
        ${tagHtml}
        <div class="ml-card-meta">
            <span>🧩 ${m.piece_count||0} pieces</span>
            ${m.play_count ? `<span>▶ ${m.play_count} plays</span>` : ''}
            ${m.published_at ? `<span>📅 ${formatDate(m.published_at)}</span>` : ''}
        </div>
        <div class="ml-card-meta ml-author">
            by <a href="/marbles/player/${esc(m.author_login||'')}">${esc(m.author_login||'unknown')}</a>
        </div>
        <div class="ml-card-actions">
            <a class="ml-btn primary" href="/apps/marble-editor?load=${encodeURIComponent(m.map_id)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Load
            </a>
            <a class="ml-btn" href="/marbles/leaderboard/${encodeURIComponent(m.map_id)}">🏆</a>
            <button class="ml-btn ml-vote-btn up" id="vote-up-${mapId}" onclick="rateMap('${mapId}',1)">👍 <span id="up-${mapId}">${up}</span></button>
            <button class="ml-btn ml-vote-btn down" id="vote-dn-${mapId}" onclick="rateMap('${mapId}',-1)">👎 <span id="dn-${mapId}">${down}</span></button>
        </div>
    </div>`;
}

async function rateMap(mapId, vote) {
    const res = await fetch(`/marbles/api/map/${encodeURIComponent(mapId)}/rate`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({vote}),
    });
    if (res.status === 401) {
        window.location.href = '/login?next=' + encodeURIComponent(location.pathname);
        return;
    }
    if (!res.ok) return;
    const data = await res.json();
    const upEl = document.getElementById('up-' + mapId);
    const dnEl = document.getElementById('dn-' + mapId);
    if (upEl) upEl.textContent = data.upvotes;
    if (dnEl) dnEl.textContent = data.downvotes;
}

function setTagFilter(tag) {
    _activeTag = (_activeTag === tag) ? '' : tag;
    document.querySelectorAll('.ml-tag-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tag === _activeTag);
    });
    filterMaps();
}

function filterMaps() {
    const q = document.getElementById('mlSearch').value.trim().toLowerCase();
    let filtered = _allMaps;
    if (q) filtered = filtered.filter(m =>
        (m.name||'').toLowerCase().includes(q) ||
        (m.author_login||'').toLowerCase().includes(q) ||
        (m.description||'').toLowerCase().includes(q) ||
        (m.tags||'').toLowerCase().includes(q)
    );
    if (_activeTag) filtered = filtered.filter(m => parseTags(m.tags).includes(_activeTag));

    const grid = document.getElementById('mlGrid');
    if (!filtered.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;" class="ml-empty">No maps found.</div>`;
        return;
    }
    grid.innerHTML = filtered.map(m => renderCard(m)).join('');
}

function buildTagBar() {
    const allTags = new Set();
    _allMaps.forEach(m => parseTags(m.tags).forEach(t => allTags.add(t)));
    const bar = document.getElementById('mlTagsBar');
    if (!allTags.size) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    bar.innerHTML = '<span class="ml-tags-bar-label">Filter:</span>' +
        [...allTags].sort().map(t =>
            `<button class="ml-tag-btn" data-tag="${esc(t)}" onclick="setTagFilter('${esc(t)}')">${esc(t)}</button>`
        ).join('');
}

async function load() {
    const [mapsRes, featRes] = await Promise.all([
        fetch('/marbles/api/maps'),
        fetch('/marbles/api/maps/featured'),
    ]);
    if (!mapsRes.ok) {
        document.getElementById('mlGrid').innerHTML = '<div style="grid-column:1/-1;" class="ml-empty">Failed to load maps.</div>';
        return;
    }
    _allMaps = await mapsRes.json();
    document.getElementById('mlSub').textContent =
        _allMaps.length ? `${_allMaps.length} published map${_allMaps.length === 1 ? '' : 's'}` : 'No maps published yet.';

    if (featRes.ok) {
        const featured = await featRes.json();
        const featSection = document.getElementById('mlFeaturedSection');
        const featGrid = document.getElementById('mlFeaturedGrid');
        if (featured.length) {
            featGrid.innerHTML = featured.map(m => renderCard(m, true)).join('');
            featSection.style.display = '';
        }
    }

    buildTagBar();
    filterMaps();
}

load();
</script>

</body>
</html>
