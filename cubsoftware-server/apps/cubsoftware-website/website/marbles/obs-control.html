<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marbles OBS Dock</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0d1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            padding: 10px;
        }
        h2 {
            font-size: 13px;
            font-weight: 700;
            color: #5865f2;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }
        .session-id {
            font-size: 10px;
            color: #555;
            margin-bottom: 10px;
            word-break: break-all;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px 10px;
            background: #1a1a2e;
            border-radius: 6px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-dot.waiting  { background: #555; }
        .status-dot.running  { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .status-dot.ended    { background: #ef4444; }
        .status-label {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.06em;
        }
        .player-count { margin-left: auto; color: #888; font-size: 11px; }

        .btn-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .btn {
            flex: 1;
            padding: 7px 4px;
            border-radius: 6px;
            border: 1px solid #2a2a3a;
            background: #16162a;
            color: #c0c0d0;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.12s;
            text-align: center;
        }
        .btn:hover { border-color: #5865f2; color: #5865f2; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn.primary { background: #5865f2; border-color: #5865f2; color: #fff; }
        .btn.primary:hover { background: #4752c4; border-color: #4752c4; }
        .btn.danger  { border-color: #ef444480; color: #ef4444; }
        .btn.danger:hover  { background: #ef444420; }

        .section-title {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }
        .player-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 300px;
            overflow-y: auto;
        }
        .player-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            background: #1a1a2e;
            border-radius: 5px;
            font-size: 11px;
        }
        .player-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .player-name { flex: 1; }
        .player-rank { color: #888; font-size: 10px; }

        .toast {
            position: fixed;
            bottom: 10px; left: 10px; right: 10px;
            background: #22c55e;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .toast.err { background: #ef4444; }

        .error-box {
            background: #2a0a0a;
            border: 1px solid #ef444440;
            color: #ef4444;
            font-size: 11px;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: none;
        }
        .ability-log {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
        }
        .ability-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            background: #1a1a2e;
            border-radius: 5px;
            font-size: 11px;
        }
        .ability-row .ab-icon { font-size: 13px; flex-shrink: 0; }
        .ability-row .ab-caster { color: #a78bfa; font-weight: 600; }
        .ability-row .ab-label { flex: 1; color: #c0c0d0; }
        .ability-row .ab-target { color: #888; }
        .ability-row .ab-cost { color: #f59e0b; margin-left: auto; flex-shrink: 0; font-size: 10px; }
    </style>
</head>
<body>
<h2>Marbles Control</h2>
<div class="session-id" id="sessionIdLabel">Session: —</div>

<div id="errorBox" class="error-box"></div>

<div class="status-row">
    <div class="status-dot waiting" id="statusDot"></div>
    <span class="status-label" id="statusLabel">—</span>
    <span class="player-count" id="playerCount">0 players</span>
</div>

<div class="btn-row">
    <button class="btn primary" id="btnStart">▶ Start</button>
    <button class="btn" id="btnReset">↺ Reset</button>
    <button class="btn danger" id="btnEnd">■ End</button>
</div>

<div class="section-title">Players</div>
<div class="player-list" id="playerList"></div>

<div class="section-title" style="margin-top:14px;">Ability Log</div>
<div class="ability-log" id="abilityLog"><div style="color:#444;font-size:11px;padding:4px 8px;">No abilities fired yet.</div></div>

<div class="toast" id="toast"></div>

<script>
const SESSION_ID = location.pathname.split('/').pop();
document.getElementById('sessionIdLabel').textContent = 'Session: ' + SESSION_ID;

let lastState = '';

function showToast(msg, err) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (err ? ' err' : '');
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function setError(msg) {
    const b = document.getElementById('errorBox');
    if (msg) { b.textContent = msg; b.style.display = 'block'; }
    else b.style.display = 'none';
}

const COLOURS = {};
function colourFor(name) {
    if (!COLOURS[name]) {
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
        COLOURS[name] = `hsl(${h},60%,60%)`;
    }
    return COLOURS[name];
}

async function refresh() {
    try {
        const res = await fetch(`/marbles/api/game/${SESSION_ID}`);
        if (!res.ok) { setError('Session not found'); return; }
        setError('');
        const data = await res.json();
        const state = data.state || 'waiting';

        // Status dot
        const dot = document.getElementById('statusDot');
        dot.className = 'status-dot ' + (state === 'running' ? 'running' : state === 'ended' ? 'ended' : 'waiting');
        document.getElementById('statusLabel').textContent = state.toUpperCase();

        const players = data.players || [];
        document.getElementById('playerCount').textContent = players.length + ' players';

        // Button states
        document.getElementById('btnStart').disabled = state !== 'waiting';
        document.getElementById('btnReset').disabled = state === 'waiting' && players.length === 0;
        document.getElementById('btnEnd').disabled   = state === 'ended';

        // Player list
        const results = data.results || [];
        const resultMap = {};
        results.forEach(r => { resultMap[r.username || r.twitch_login] = r.rank; });

        const list = document.getElementById('playerList');
        list.innerHTML = '';
        if (!players.length) {
            list.innerHTML = '<div style="color:#444;font-size:11px;padding:6px 8px;">No players joined yet.</div>';
        } else {
            players.forEach(name => {
                const row = document.createElement('div');
                row.className = 'player-row';
                const rank = resultMap[name];
                row.innerHTML = `
                    <div class="player-dot" style="background:${colourFor(name)}"></div>
                    <span class="player-name">${name}</span>
                    <span class="player-rank">${rank ? '#' + rank : ''}</span>`;
                list.appendChild(row);
            });
        }
    } catch (e) {
        setError('Connection error');
    }
}

async function action(endpoint, label) {
    try {
        const res = await fetch(`/marbles/api/game/${SESSION_ID}/${endpoint}`, { method: 'POST' });
        if (!res.ok) throw new Error();
        showToast(label + ' OK');
        refresh();
    } catch {
        showToast(label + ' failed', true);
    }
}

document.getElementById('btnStart').addEventListener('click', () => action('start', 'Start'));
document.getElementById('btnReset').addEventListener('click', () => action('reset', 'Reset'));
document.getElementById('btnEnd').addEventListener('click',   () => action('end',   'End'));

const ABILITY_ICONS = {
    speed_burst: '⚡', shield: '🛡️', mega_bounce: '🏀', ghost: '👻', shrink: '🔬',
    jump: '🦘', sticky_wheels: '🍯', freeze: '❄️', ice_blast: '🧊', tp_home: '🏠',
    swap: '🔄', earthquake: '🌋', magnet: '🧲', reverse: '↩️', gravity_flip: '🔃',
    glue: '🦶', size_up: '🔴', global_quake: '🌍', global_grav: '🌀', chaos: '🎲',
    speed_all: '🚀',
};

const ABILITY_COSTS = {
    speed_burst: 50, shield: 80, mega_bounce: 60, ghost: 100, shrink: 40,
    jump: 35, sticky_wheels: 45, freeze: 70, ice_blast: 50, tp_home: 65,
    swap: 120, earthquake: 80, magnet: 70, reverse: 75, gravity_flip: 90,
    glue: 55, size_up: 60, global_quake: 200, global_grav: 250, chaos: 300, speed_all: 180,
};

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function refreshAbilityLog() {
    try {
        const res = await fetch(`/marbles/api/game/${SESSION_ID}/ability-log`);
        if (!res.ok) return;
        const data = await res.json();
        const log = data.log || [];
        const el = document.getElementById('abilityLog');
        if (!log.length) {
            el.innerHTML = '<div style="color:#444;font-size:11px;padding:4px 8px;">No abilities fired yet.</div>';
            return;
        }
        el.innerHTML = log.map(e => {
            const icon = ABILITY_ICONS[e.ability] || '✨';
            const cost = ABILITY_COSTS[e.ability] || '?';
            const target = e.target ? `→ <span class="ab-target">${escHtml(e.target)}</span>` : '';
            return `<div class="ability-row">
                <span class="ab-icon">${icon}</span>
                <span class="ab-caster">${escHtml(e.caster)}</span>
                <span class="ab-label">${escHtml(e.label || e.ability)} ${target}</span>
                <span class="ab-cost">${cost}c</span>
            </div>`;
        }).join('');
    } catch (_) {}
}

refresh();
refreshAbilityLog();
setInterval(refresh, 2000);
setInterval(refreshAbilityLog, 3000);
</script>
</body>
</html>
