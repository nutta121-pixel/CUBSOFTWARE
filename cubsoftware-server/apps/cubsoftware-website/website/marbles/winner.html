<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marbles Winner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 400px; height: 200px;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', sans-serif;
        }

        #card {
            width: 400px; height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(10,10,20,0.95) 0%, rgba(20,20,40,0.95) 100%);
            border: 1px solid rgba(88,101,242,0.3);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(88,101,242,0.15), inset 0 0 60px rgba(88,101,242,0.03);
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        #card.show {
            opacity: 1;
            transform: scale(1);
        }

        .trophy { font-size: 40px; line-height: 1; }

        .label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #fbbf24;
        }

        .winner-name {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            max-width: 340px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
        }

        .winner-time {
            font-size: 13px;
            color: #22c55e;
            font-weight: 600;
        }

        .marble-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            vertical-align: middle;
            box-shadow: 0 0 8px currentColor;
        }

        /* Confetti particles */
        .confetti {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 1px;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(220px) rotate(720deg); opacity: 0; }
        }

        .waiting {
            font-size: 12px;
            color: #444;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
<div id="card">
    <div class="waiting" id="waiting">Waiting for race to finish…</div>
</div>

<script>
const SESSION_ID = location.pathname.split('/').pop();

function colourFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return `hsl(${h},60%,60%)`;
}

function formatMs(ms) {
    if (!ms) return '';
    const s = ms / 1000;
    const m = Math.floor(s / 60);
    const sec = (s % 60).toFixed(2);
    return m > 0 ? `${m}:${sec.padStart(5,'0')}` : `${sec}s`;
}

function spawnConfetti() {
    const colors = ['#fbbf24','#5865f2','#22c55e','#ef4444','#a855f7','#06b6d4'];
    for (let i = 0; i < 24; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.cssText = `
            left: ${Math.random() * 400}px;
            top: 0;
            background: ${colors[Math.floor(Math.random() * colors.length)]};
            animation-duration: ${0.8 + Math.random() * 1.2}s;
            animation-delay: ${Math.random() * 0.5}s;
            width: ${4 + Math.random() * 6}px;
            height: ${4 + Math.random() * 6}px;
        `;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
    }
}

let shown = false;

async function refresh() {
    try {
        const res = await fetch(`/marbles/api/game/${SESSION_ID}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.state !== 'ended') return;

        const results = (data.results || []).sort((a, b) => a.rank - b.rank);
        if (!results.length) return;

        const winner = results[0];
        const name   = winner.username || winner.twitch_login || '?';
        const colour = colourFor(name);
        const time   = winner.finish_time_ms ? formatMs(winner.finish_time_ms) : '';

        const card = document.getElementById('card');
        card.innerHTML = `
            <div class="trophy">🏆</div>
            <div class="label">Winner</div>
            <div class="winner-name">
                <span class="marble-dot" style="background:${colour};color:${colour}"></span>${name}
            </div>
            ${time ? `<div class="winner-time">${time}</div>` : ''}
        `;

        if (!shown) {
            shown = true;
            // brief delay then animate in
            setTimeout(() => { card.classList.add('show'); spawnConfetti(); }, 100);
            // re-spawn confetti every 3s
            setInterval(spawnConfetti, 3000);
        }
    } catch {}
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
