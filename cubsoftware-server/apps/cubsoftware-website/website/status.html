<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5865f2">
    <title>Status - CUB SOFTWARE</title>
    <meta name="description" content="CUB SOFTWARE service status - Check the status of all applications, bots, and API endpoints.">
    <link rel="icon" type="image/png" href="/static/images/company-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css?v={{ v }}">
    <style>
        .status-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        .status-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .status-header .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
        }

        .status-header .logo .cub { color: #fff; }
        .status-header .logo .software { color: #5865f2; }

        .status-header h1 {
            font-size: 1.2rem;
            font-weight: 500;
            color: rgba(255,255,255,0.7);
            margin-top: 0.3rem;
        }

        .overall-status {
            text-align: center;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .overall-status.operational {
            background: rgba(87, 242, 135, 0.15);
            color: #57f287;
            border: 1px solid rgba(87, 242, 135, 0.3);
        }

        .overall-status.degraded {
            background: rgba(254, 231, 92, 0.15);
            color: #fee75c;
            border: 1px solid rgba(254, 231, 92, 0.3);
        }

        .overall-status.outage {
            background: rgba(237, 66, 69, 0.15);
            color: #ed4245;
            border: 1px solid rgba(237, 66, 69, 0.3);
        }

        .status-section {
            margin-bottom: 2rem;
        }

        .status-section h2 {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .service-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 1rem 1.2rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .service-card:hover {
            background: rgba(255,255,255,0.08);
        }

        .service-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .service-name {
            font-weight: 600;
            color: #fff;
            font-size: 1rem;
        }

        .service-desc {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
        }

        .service-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.3rem;
        }

        .service-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .service-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.online { background: #57f287; box-shadow: 0 0 8px rgba(87,242,135,0.5); }
        .status-dot.stopped, .status-dot.errored { background: #ed4245; box-shadow: 0 0 8px rgba(237,66,69,0.5); }
        .status-dot.unknown { background: #fee75c; box-shadow: 0 0 8px rgba(254,231,92,0.5); }

        .service-status .online { color: #57f287; }
        .service-status .stopped, .service-status .errored { color: #ed4245; }
        .service-status .unknown { color: #fee75c; }

        .api-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .api-path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
        }

        .last-updated {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .status-loading {
            text-align: center;
            padding: 3rem;
            color: rgba(255,255,255,0.5);
        }

        .refresh-btn {
            background: rgba(88,101,242,0.2);
            border: 1px solid rgba(88,101,242,0.3);
            color: #5865f2;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(88,101,242,0.3);
        }

        @media (max-width: 640px) {
            .service-card { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .service-meta { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="status-container">
        <div class="status-header">
            <div class="logo"><span class="cub">CUB</span><span class="software"> SOFTWARE</span></div>
            <h1>Service Status</h1>
        </div>

        <div id="statusContent">
            <div class="status-loading">
                <div class="spinner" style="margin: 0 auto 1rem;"></div>
                <p>Checking service status...</p>
            </div>
        </div>

        <div class="last-updated" id="lastUpdated"></div>

        <div style="text-align: center; margin-bottom: 2rem;">
            <button class="refresh-btn" onclick="loadStatus()">Refresh Status</button>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-text">
                &copy; 2026 CUB SOFTWARE. Made with love by
                <a href="https://discord.com/users/378501056008683530" target="_blank" rel="noopener noreferrer" class="footer-link">CUB</a>
            </div>
            <div class="footer-links">
                <a href="/">Home</a>
                <a href="/status">Status</a>
                <a href="/terms">Terms</a>
                <a href="/privacy">Privacy</a>
                <a href="/copyright">Copyright</a>
                <a href="/report">Report Issue</a>
                <a href="/contact">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        function formatUptime(ms) {
            if (!ms || ms === 0) return 'N/A';
            const now = Date.now();
            const diff = now - ms;
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            if (days > 0) return days + 'd ' + hours + 'h';
            if (hours > 0) return hours + 'h ' + mins + 'm';
            return mins + 'm';
        }

        function statusLabel(status) {
            if (status === 'online') return 'Operational';
            if (status === 'stopped') return 'Offline';
            if (status === 'errored') return 'Error';
            return 'Unknown';
        }

        async function loadStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                let html = '';

                // Overall status banner
                html += `<div class="overall-status ${data.overall}">`;
                if (data.overall === 'operational') html += 'All Systems Operational';
                else if (data.overall === 'degraded') html += 'Some Services Degraded';
                else html += 'Major Service Outage';
                html += '</div>';

                // Services
                html += '<div class="status-section"><h2>Applications & Bots</h2>';
                for (const svc of data.services) {
                    html += `<div class="service-card">
                        <div class="service-info">
                            <div class="service-name">${svc.name}</div>
                            <div class="service-desc">${svc.description || ''}</div>
                            <div class="service-meta">`;
                    if (svc.uptime) html += `<span>Uptime: ${formatUptime(svc.uptime)}</span>`;
                    if (svc.memory_mb) html += `<span>Memory: ${svc.memory_mb} MB</span>`;
                    if (svc.restarts !== undefined) html += `<span>Restarts: ${svc.restarts}</span>`;
                    if (svc.url) html += `<span><a href="${svc.url}" target="_blank" style="color: #5865f2;">${svc.url}</a></span>`;
                    html += `</div></div>
                        <div class="service-status">
                            <div class="status-dot ${svc.status}"></div>
                            <span class="${svc.status}">${statusLabel(svc.status)}</span>
                        </div>
                    </div>`;
                }
                html += '</div>';

                // API Endpoints
                html += '<div class="status-section"><h2>API Endpoints</h2>';
                for (const api of data.api_endpoints) {
                    html += `<div class="api-card">
                        <div>
                            <div class="service-name">${api.name}</div>
                            <div class="api-path">${api.path}</div>
                        </div>
                        <div class="service-status">
                            <div class="status-dot ${api.status}"></div>
                            <span class="${api.status}">${statusLabel(api.status)}</span>
                        </div>
                    </div>`;
                }
                html += '</div>';

                document.getElementById('statusContent').innerHTML = html;
                document.getElementById('lastUpdated').textContent = 'Last updated: ' + data.server_time;

            } catch (e) {
                document.getElementById('statusContent').innerHTML = '<div class="status-loading"><p>Failed to load status. Please try again.</p></div>';
            }
        }

        loadStatus();
        // Auto-refresh every 30 seconds
        setInterval(loadStatus, 30000);
    </script>
</body>
</html>
