<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5865f2">
    <title>Status - CUB SOFTWARE</title>
    <meta name="description" content="CUB SOFTWARE service status — check the status of all applications, bots, and API endpoints.">
    <link rel="icon" type="image/png" href="/static/images/company-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css?v={{ v }}">
    <link rel="stylesheet" href="/static/css/status.css?v={{ v }}">
</head>
<body>
    <div class="status-page-wrap">
        <div class="status-container">
            <div class="status-header">
                <div class="logo"><span class="cub">CUB</span><span class="software"> SOFTWARE</span></div>
                <h1>Service Status</h1>
            </div>

            <div id="statusContent">
                <div class="status-loading">
                    <div class="spinner" style="margin: 0 auto 1rem;"></div>
                    <p>Checking service status...</p>
                </div>
            </div>

            <div class="status-footer-row">
                <div class="last-updated-text" id="lastUpdated"></div>
                <button class="refresh-btn" onclick="loadStatus()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"/>
                        <polyline points="1 20 1 14 7 14"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>

        {% include 'footer.html' %}
    </div>

    <script>
        function formatUptime(ms) {
            if (!ms || ms === 0) return 'N/A';
            const now = Date.now();
            const diff = now - ms;
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            if (days > 0) return days + 'd ' + hours + 'h';
            if (hours > 0) return hours + 'h ' + mins + 'm';
            return mins + 'm';
        }

        function statusLabel(status) {
            if (status === 'online') return 'Operational';
            if (status === 'stopped') return 'Offline';
            if (status === 'errored') return 'Error';
            return 'Unknown';
        }

        async function loadStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                let html = '';

                // Overall status banner
                html += `<div class="overall-status ${data.overall}">`;
                if (data.overall === 'operational') html += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> All Systems Operational';
                else if (data.overall === 'degraded') html += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Some Services Degraded';
                else html += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Major Service Outage';
                html += '</div>';

                // Services
                html += '<div class="status-section"><h2>Applications &amp; Bots</h2>';
                for (const svc of data.services) {
                    html += `<div class="service-card">
                        <div class="service-info">
                            <div class="service-name">${svc.name}</div>
                            <div class="service-desc">${svc.description || ''}</div>
                            <div class="service-meta">`;
                    if (svc.uptime) html += `<span>Uptime: ${formatUptime(svc.uptime)}</span>`;
                    if (svc.memory_mb) html += `<span>Memory: ${svc.memory_mb} MB</span>`;
                    if (svc.restarts !== undefined) html += `<span>Restarts: ${svc.restarts}</span>`;
                    if (svc.url) html += `<span><a href="${svc.url}" target="_blank">${svc.url}</a></span>`;
                    html += `</div></div>
                        <div class="service-status">
                            <div class="status-dot ${svc.status}"></div>
                            <span class="${svc.status}">${statusLabel(svc.status)}</span>
                        </div>
                    </div>`;
                }
                html += '</div>';

                // API Endpoints
                html += '<div class="status-section"><h2>API Endpoints</h2>';
                for (const api of data.api_endpoints) {
                    html += `<div class="api-card">
                        <div>
                            <div class="service-name">${api.name}</div>
                            <div class="api-path">${api.path}</div>
                        </div>
                        <div class="service-status">
                            <div class="status-dot ${api.status}"></div>
                            <span class="${api.status}">${statusLabel(api.status)}</span>
                        </div>
                    </div>`;
                }
                html += '</div>';

                document.getElementById('statusContent').innerHTML = html;
                document.getElementById('lastUpdated').textContent = 'Last updated: ' + data.server_time;

            } catch (e) {
                document.getElementById('statusContent').innerHTML = '<div class="status-loading"><p>Failed to load status. Please try again.</p></div>';
            }
        }

        loadStatus();
        setInterval(loadStatus, 30000);
    </script>
</body>
</html>
