<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamAvatars Overlay — {{ channel }}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
}
#overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
}
.sprite-wrap {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
    transition: none;
}
.sprite-canvas {
    image-rendering: pixelated;
    display: block;
}
.sprite-label {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
    white-space: nowrap;
    text-align: center;
    user-select: none;
}
.sprite-bubble {
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 5px 10px;
    font-size: 12px;
    color: #fff;
    max-width: 200px;
    word-break: break-word;
    text-align: center;
    backdrop-filter: blur(4px);
    animation: bubbleIn 0.2s ease;
    position: relative;
}
.sprite-bubble::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: rgba(0,0,0,0.75);
}
@keyframes bubbleIn {
    from { opacity:0; transform: scale(0.8) translateY(4px); }
    to   { opacity:1; transform: scale(1)   translateY(0); }
}
</style>
</head>
<body>
<div id="overlay"></div>
<script>
const CHANNEL  = '{{ channel }}';
const POLL_MS  = 2000;
</script>
<script src="/streamavatars/static/js/overlay.js?v={{ v }}"></script>
</body>
</html>
