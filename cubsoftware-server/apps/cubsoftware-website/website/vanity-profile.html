<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/u/{{ slug }} | CUB SOFTWARE</title>
    <link rel="icon" type="image/png" href="/static/images/company-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared.css?v={{ v }}">
    <link rel="stylesheet" href="/static/css/vanity-profile.css?v={{ v }}">
</head>
<body>
{% include 'header.html' %}
<main>
    <div class="profile-wrap">
        <div class="profile-header">
            <div class="profile-avatar" id="profile-avatar">{{ slug[0].upper() }}</div>
            <div>
                <div class="profile-name" id="profile-name">{{ slug }}</div>
                <div class="profile-slug">cubsoftware.site/u/{{ slug }}</div>
            </div>
            <div class="profile-cta">
                <a href="https://cubsoftware.site/bot-dashboard" class="btn btn-primary">Get Your Own →</a>
            </div>
        </div>

        <div class="section-title">Bots</div>
        <div id="bots-container" class="loading">Loading bots...</div>
    </div>
</main>
{% include 'footer.html' %}

<script>
    const USER_ID = '{{ user_id }}';
    const SLUG = '{{ slug }}';

    async function loadProfile() {
        try {
            const res = await fetch(`/api/vanity/${SLUG}/bots`);
            const data = await res.json();
            const container = document.getElementById('bots-container');

            if (!data.bots || data.bots.length === 0) {
                container.innerHTML = '<div class="empty">No public bots yet.</div>';
                return;
            }

            // Update header with Discord user info if available
            if (data.username) {
                document.getElementById('profile-name').textContent = data.username;
                if (data.avatar_url) {
                    document.getElementById('profile-avatar').innerHTML = `<img src="${data.avatar_url}" alt="avatar">`;
                }
            }

            container.className = 'bots-grid';
            container.innerHTML = data.bots.map(bot => `
                <div class="bot-card">
                    <div class="bot-card-avatar">${bot.avatar_url ? `<img src="${bot.avatar_url}" alt="${bot.name}">` : bot.name[0]}</div>
                    <div class="bot-card-name">${escHtml(bot.name)}</div>
                    <div class="bot-card-guilds"><span class="status-dot"></span>${bot.guild_count} server${bot.guild_count !== 1 ? 's' : ''}</div>
                </div>
            `).join('');
        } catch (e) {
            document.getElementById('bots-container').innerHTML = '<div class="empty">Failed to load profile.</div>';
        }
    }

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadProfile();
</script>
</body>
</html>
