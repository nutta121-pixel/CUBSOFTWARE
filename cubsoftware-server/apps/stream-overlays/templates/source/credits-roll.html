<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Credits Roll</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a1a; }
#overlay {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    --bg: #0a0a1a; --bg2: #1a0a2e; --accent: #7c3aed;
    --text1: #fff; --text2: #a0a0c0; --font: 'Orbitron';
    font-family: var(--font), sans-serif;
    background: var(--bg);
    transition: background 0.6s ease;
}
.bg-gradient { background: linear-gradient(var(--bg-angle, 135deg), var(--bg), var(--bg2)) !important; }
.bg-animated-gradient {
    background: linear-gradient(var(--bg-angle, 135deg), var(--bg), var(--bg2), var(--bg)) !important;
    background-size: 400% 400% !important;
    animation: bgShift 8s ease infinite;
}
@keyframes bgShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

/* Scroll area */
#particles { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
#bg-effects { position: absolute; inset: 0; z-index: 1; pointer-events: none; width: 1920px; height: 1080px; }
.credits-scroll-area { position: absolute; inset: 0; overflow: hidden; z-index: 5; }
.credits-content {
    position: absolute; width: 100%; left: 0;
    padding: 0 320px 0;
    text-align: center;
    will-change: transform;
}
/* Top/bottom fade mask */
.credits-vignette {
    position: absolute; inset: 0; z-index: 20; pointer-events: none;
    background: linear-gradient(180deg, var(--bg) 0%, transparent 12%, transparent 88%, var(--bg) 100%);
}

/* Main header */
.credits-main-header { padding: 120px 0 60px; }
.credits-main-title {
    font-size: 88px; font-weight: 900; color: var(--text1); letter-spacing: 8px;
    text-transform: uppercase; margin-bottom: 16px; font-family: var(--font), sans-serif;
}
.credits-main-subtitle {
    font-size: 30px; color: var(--text2); font-family: Poppins, sans-serif; font-weight: 400; letter-spacing: 1px;
}
.credits-divider {
    width: 500px; height: 2px; margin: 36px auto;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
}

/* Sections */
.credits-section { margin: 56px 0; }
.credits-section-label {
    font-size: 14px; letter-spacing: 6px; text-transform: uppercase;
    color: var(--accent); font-family: var(--font), sans-serif; font-weight: 700;
    margin-bottom: 20px; opacity: 0.9;
}
.credits-names {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.credits-name {
    font-size: 26px; color: var(--text1); font-family: Poppins, sans-serif;
    font-weight: 500; padding: 4px 0; letter-spacing: 0.5px; text-align: center;
}
.credits-footer {
    padding: 80px 0 60px;
    font-size: 44px; color: var(--accent);
    font-family: var(--font), sans-serif; font-weight: 700; letter-spacing: 4px;
}

/* End message */
#endMessage {
    display: none;
    position: absolute; inset: 0; z-index: 30;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 80px 200px;
    opacity: 0; transition: opacity 1.5s ease;
}
#endMessage.visible { opacity: 1; }
#endMessageText {
    font-size: 72px; font-weight: 900; color: var(--text1);
    font-family: var(--font), sans-serif; letter-spacing: 4px;
    line-height: 1.3; white-space: pre-line;
}
#endMessageSub {
    font-size: 28px; color: var(--text2); font-family: Poppins, sans-serif;
    font-weight: 400; margin-top: 24px; letter-spacing: 1px;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bebas+Neue&family=Chakra+Petch:wght@400;600;700&family=Exo+2:wght@400;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&family=Pacifico&family=Poppins:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlays/static/css/overlays-effects.css?v={{ v }}">
</head>
<body>
<div id="overlay" class="minimal">
    <canvas id="particles"></canvas>
    <canvas id="bg-effects" width="1920" height="1080"></canvas>
    <div class="credits-scroll-area">
        <div id="creditsContent" class="credits-content"></div>
    </div>
    <div class="credits-vignette"></div>
    <div id="endMessage">
        <div id="endMessageText"></div>
        <div id="endMessageSub"></div>
    </div>
</div>

<script src="/overlays/static/js/overlays-effects.js?v={{ v }}"></script>
<script>
const SCENE_ID = '{{ scene_id }}';
let config = {};

// ── Live IRC data collection ──────────────────────────────────────────────────
const liveData = { mods: new Set(), vips: new Set(), subs: new Set(), giftSubs: new Set(), raiders: new Set(), chat: new Set(), followers: new Set() };
let _creditsWs = null, _creditsChannel = '', _creditsReconnectTimer = null;

// ── Server-side follower polling (via EventSub webhook) ──────────────────────
let _followerPollInterval = null;
let _followerPollChannel = '';

async function fetchSessionFollowers(channel) {
    if (!channel) return;
    try {
        const r = await fetch(`/overlays/api/twitch/session-followers?channel=${encodeURIComponent(channel)}`);
        if (!r.ok) return;
        const data = await r.json();
        if (!data.connected) return;
        let changed = false;
        (data.followers || []).forEach(name => {
            if (!liveData.followers.has(name)) { liveData.followers.add(name); changed = true; }
        });
        if (changed) {
            const sig = getContentSig(config);
            // Force rebuild since liveData changed but config sig may not have
            _creditsContentSig = null;
            const el = document.getElementById('creditsContent');
            if (el) el.innerHTML = buildCreditsHTML(config);
        }
    } catch(e) {}
}

function startFollowerPolling(channel) {
    if (_followerPollInterval) clearInterval(_followerPollInterval);
    _followerPollChannel = channel;
    fetchSessionFollowers(channel); // immediate fetch
    _followerPollInterval = setInterval(() => fetchSessionFollowers(_followerPollChannel), 30000);
}

function connectCreditsIRC(channel) {
    if (!channel) return;
    clearTimeout(_creditsReconnectTimer);
    if (_creditsWs) { _creditsWs.onclose = null; _creditsWs.close(); _creditsWs = null; }
    _creditsChannel = channel.toLowerCase().replace('#', '');
    _creditsWs = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    _creditsWs.onopen = () => {
        _creditsWs.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
        _creditsWs.send('PASS oauth:ANONYMOUS');
        _creditsWs.send('NICK justinfan' + Math.floor(Math.random() * 99999));
        _creditsWs.send('JOIN #' + _creditsChannel);
    };
    _creditsWs.onmessage = ev => {
        ev.data.split('\r\n').forEach(line => {
            if (!line) return;
            if (line.startsWith('PING')) { _creditsWs.send('PONG :tmi.twitch.tv'); return; }

            // Parse tags
            let tags = {}, rest = line;
            if (line.startsWith('@')) {
                const sp = line.indexOf(' ');
                line.slice(1, sp).split(';').forEach(t => { const [k, v] = t.split('='); tags[k] = v || ''; });
                rest = line.slice(sp + 1);
            }

            // PRIVMSG — collect chatter + roles
            const pm = rest.match(/^:\S+!\S+@\S+ PRIVMSG #\S+ :(.*)$/);
            if (pm) {
                const displayName = tags['display-name'] || (rest.match(/^:(\w+)!/) || [])[1] || '';
                if (!displayName) return;
                const badges = tags['badges'] || '';
                if (badges.includes('moderator') || badges.includes('staff') || tags['mod'] === '1') liveData.mods.add(displayName);
                else if (badges.includes('vip')) liveData.vips.add(displayName);
                if (tags['subscriber'] === '1' || badges.includes('subscriber')) liveData.subs.add(displayName);
                liveData.chat.add(displayName);
                return;
            }

            // USERNOTICE — sub gifts and raids
            const un = rest.match(/^:tmi\.twitch\.tv USERNOTICE #\S+(?: :(.*))?$/);
            if (un) {
                const msgId = tags['msg-id'];
                const dn = tags['display-name'] || '';
                if (msgId === 'subgift' || msgId === 'submysterygift') { if (dn) liveData.giftSubs.add(dn); }
                else if (msgId === 'sub' || msgId === 'resub') { if (dn) { liveData.subs.add(dn); liveData.chat.add(dn); } }
                else if (msgId === 'raid') { if (dn) liveData.raiders.add(dn + ' · ' + (tags['msg-param-viewerCount'] || '?') + ' viewers'); }
            }
        });
    };
    _creditsWs.onclose = () => { _creditsReconnectTimer = setTimeout(() => connectCreditsIRC(_creditsChannel), 5000); };
    _creditsWs.onerror = () => {};
}
let _particles = [];
let _particleAnim = null;
let _prevBgEffect = '__init__';
let _prevBgSpeed = '__init__';
let _prevParticles = '__init__';
let _prevParticleColor = '__init__';
let _scrollTimeout = null;
let _creditsContentSig = null;

// Keys that affect the scrolling content — changes here restart the scroll.
// Pure visual tweaks (colors, particles, bg) update without interrupting.
const _CONTENT_KEYS = [
    'title','subtitle',
    'credits_mods','credits_mods_label','credits_mods_show',
    'credits_vips','credits_vips_label','credits_vips_show',
    'credits_subs','credits_subs_label','credits_subs_show',
    'credits_gift_subs','credits_gift_subs_label','credits_gift_subs_show',
    'credits_followers','credits_followers_label','credits_followers_show',
    'credits_raiders','credits_raiders_label','credits_raiders_show',
    'credits_chat','credits_chat_label','credits_chat_show',
    'credits_scroll_speed','credits_loop','credits_auto_twitch',
    'credits_footer_symbol','credits_section_spacing',
    'credits_title_size','credits_subtitle_size','credits_section_label_size',
    'credits_name_size','credits_name_bg_enabled','credits_name_padding','credits_name_border_radius',
    'credits_divider_width','credits_footer_size','credits_footer_show',
    'credits_end_message','credits_end_message_sub','credits_end_message_size',
];

function getContentSig(cfg) {
    return _CONTENT_KEYS.map(k => cfg[k]).join('|');
}

function escHTML(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function parseNames(raw) {
    if (!raw) return [];
    return raw.split(/[\n,]+/).map(n => n.trim()).filter(Boolean);
}

function getNamesForSection(cfg, key) {
    if (cfg.credits_auto_twitch !== false) {
        const liveMap = {
            credits_mods: liveData.mods, credits_vips: liveData.vips,
            credits_subs: liveData.subs, credits_gift_subs: liveData.giftSubs,
            credits_followers: liveData.followers,
            credits_raiders: liveData.raiders, credits_chat: liveData.chat,
        };
        if (liveMap[key] && liveMap[key].size > 0) return [...liveMap[key]];
    }
    return parseNames(cfg[key] || '');
}

function buildCreditsHTML(cfg) {
    const sections = [
        { key: 'credits_mods',      label: cfg.credits_mods_label      || 'Moderators' },
        { key: 'credits_vips',      label: cfg.credits_vips_label      || 'VIPs' },
        { key: 'credits_subs',      label: cfg.credits_subs_label      || 'Subscribers' },
        { key: 'credits_gift_subs', label: cfg.credits_gift_subs_label || 'Gift Sub Givers' },
        { key: 'credits_followers', label: cfg.credits_followers_label || 'New Followers' },
        { key: 'credits_raiders',   label: cfg.credits_raiders_label   || 'Raiders' },
        { key: 'credits_chat',      label: cfg.credits_chat_label      || 'Active Chat' },
    ];

    const titleStyle = [
        cfg.credits_title_color ? `color:${cfg.credits_title_color}` : '',
        cfg.credits_title_size ? `font-size:${cfg.credits_title_size}px` : '',
    ].filter(Boolean).join(';');
    const subtitleStyle = [
        cfg.credits_subtitle_color ? `color:${cfg.credits_subtitle_color}` : '',
        cfg.credits_subtitle_size ? `font-size:${cfg.credits_subtitle_size}px` : '',
    ].filter(Boolean).join(';');
    const dividerStyle = [
        cfg.credits_divider_color ? `background:linear-gradient(90deg,transparent,${cfg.credits_divider_color},transparent)` : '',
        cfg.credits_divider_width ? `width:${cfg.credits_divider_width}px` : '',
    ].filter(Boolean).join(';');
    const labelStyle = [
        cfg.credits_section_label_color ? `color:${cfg.credits_section_label_color}` : '',
        cfg.credits_section_label_size ? `font-size:${cfg.credits_section_label_size}px` : '',
    ].filter(Boolean).join(';');
    const nameStyle = [
        cfg.credits_name_color ? `color:${cfg.credits_name_color}` : '',
        cfg.credits_name_size ? `font-size:${cfg.credits_name_size}px` : '',
        cfg.credits_name_bg_enabled && cfg.credits_name_bg ? `background:${cfg.credits_name_bg};padding:${cfg.credits_name_padding||'4px 12px'};border-radius:${cfg.credits_name_border_radius||6}px` : '',
    ].filter(Boolean).join(';');
    const sectionStyle = cfg.credits_section_spacing ? `margin:${cfg.credits_section_spacing}px 0` : '';
    const footerStyle = [
        cfg.credits_footer_color ? `color:${cfg.credits_footer_color}` : '',
        cfg.credits_footer_size ? `font-size:${cfg.credits_footer_size}px` : '',
    ].filter(Boolean).join(';');

    let html = `
        <div class="credits-main-header">
            <div class="credits-main-title" style="${titleStyle}">${escHTML(cfg.title || 'Thank You!')}</div>
            <div class="credits-divider" style="${dividerStyle}"></div>
            <div class="credits-main-subtitle" style="${subtitleStyle}">${escHTML(cfg.subtitle || 'That was an amazing stream!')}</div>
        </div>
    `;

    sections.forEach(sec => {
        if (cfg[sec.key + '_show'] === false) return;
        const names = getNamesForSection(cfg, sec.key);
        if (!names.length) return;
        html += `<div class="credits-section" style="${sectionStyle}">
            <div class="credits-section-label" style="${labelStyle}">${escHTML(sec.label)}</div>
            <div class="credits-names">${names.map(n => `<span class="credits-name" style="${nameStyle}">${escHTML(n)}</span>`).join('')}</div>
        </div>`;
    });

    if (cfg.credits_footer_show !== false) {
        html += `<div class="credits-footer" style="${footerStyle}">${escHTML(cfg.credits_footer_symbol || '♥')}</div>`;
    }
    return html;
}

function showEndMessage() {
    const msg = config.credits_end_message || '';
    if (!msg) return;
    const el = document.getElementById('endMessage');
    const textEl = document.getElementById('endMessageText');
    const subEl = document.getElementById('endMessageSub');
    if (!el || !textEl) return;
    textEl.textContent = msg;
    textEl.style.fontSize = (config.credits_end_message_size || 72) + 'px';
    textEl.style.color = config.credits_end_message_color || '';
    subEl.textContent = config.credits_end_message_sub || '';
    el.style.display = 'flex';
    // Fade in on next frame
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
}

function startScroll() {
    const el = document.getElementById('creditsContent');
    if (!el) return;
    clearTimeout(_scrollTimeout);

    // Hide any visible end message before scrolling
    const endEl = document.getElementById('endMessage');
    if (endEl) { endEl.classList.remove('visible'); endEl.style.display = 'none'; }

    el.style.transition = 'none';
    el.style.transform = 'translateY(1120px)';
    el.offsetHeight; // force reflow
    const speed = Math.max(10, parseInt(config.credits_scroll_speed) || 60);
    const totalDist = el.scrollHeight + 1200;
    const duration = (totalDist / speed).toFixed(2);
    el.style.transition = `transform ${duration}s linear`;
    el.style.transform = `translateY(-${el.scrollHeight + 160}px)`;
    if (config.credits_loop !== false) {
        _scrollTimeout = setTimeout(startScroll, parseFloat(duration) * 1000 + 600);
    } else {
        _scrollTimeout = setTimeout(showEndMessage, parseFloat(duration) * 1000 + 400);
    }
}

async function loadConfig(retries = 5, delay = 1000) {
    for (let i = 0; i < retries; i++) {
        try {
            const r = await fetch('/overlays/api/scenes/' + SCENE_ID + '/config');
            if (r.ok) { config = await r.json(); applyConfig(config); return; }
        } catch(e) {}
        if (i < retries - 1) await new Promise(res => setTimeout(res, delay));
    }
}

function applyConfig(cfg) {
    config = cfg;
    const el = document.getElementById('overlay');
    el.className = cfg.template || 'minimal';

    const bgType = cfg.background_type || 'gradient';
    if (bgType === 'solid') {
        el.style.setProperty('--bg', cfg.bg_color || '#0a0a1a');
        el.style.background = cfg.bg_color || '#0a0a1a';
        el.style.backgroundImage = 'none';
    } else if (bgType === 'gradient' || bgType === 'animated-gradient') {
        el.style.setProperty('--bg', cfg.bg_gradient_from || '#0a0a1a');
        el.style.setProperty('--bg2', cfg.bg_gradient_to || '#1a0a2e');
        el.style.setProperty('--bg-angle', (cfg.bg_gradient_angle || 135) + 'deg');
        if (bgType === 'animated-gradient') el.classList.add('bg-animated-gradient');
        else el.style.background = `linear-gradient(${cfg.bg_gradient_angle||135}deg, ${cfg.bg_gradient_from||'#0a0a1a'}, ${cfg.bg_gradient_to||'#1a0a2e'})`;
    }
    el.style.setProperty('--accent', cfg.accent_color || '#7c3aed');
    el.style.setProperty('--text1', cfg.text_primary || '#ffffff');
    el.style.setProperty('--text2', cfg.text_secondary || '#a0a0c0');
    applyFontConfig(cfg, el);

    // Only rebuild + restart scroll when the actual credits content changed.
    // This prevents editor colour/style tweaks from interrupting a running scroll.
    const sig = getContentSig(cfg);
    if (sig !== _creditsContentSig) {
        _creditsContentSig = sig;
        const endEl = document.getElementById('endMessage');
        if (endEl) { endEl.classList.remove('visible'); endEl.style.display = 'none'; }
        clearTimeout(_scrollTimeout);
        // Pre-position off the bottom BEFORE changing innerHTML so the new
        // content never flashes at its natural (top/center) position.
        const content = document.getElementById('creditsContent');
        content.style.transition = 'none';
        content.style.transform = 'translateY(1120px)';
        content.offsetHeight; // force reflow — paint at 1120px before DOM changes
        content.innerHTML = buildCreditsHTML(cfg);
        _scrollTimeout = setTimeout(startScroll, 200);
    }

    const _curBgSpeed = cfg.bg_effect_speed ?? 1.0;
    if (cfg.background_effect !== _prevBgEffect || _curBgSpeed !== _prevBgSpeed) {
        _prevBgEffect = cfg.background_effect;
        _prevBgSpeed = _curBgSpeed;
        applyBackgroundEffect(cfg);
    }

    const newParticleColor = cfg.particle_color || cfg.accent_color || '#7c3aed';
    if (cfg.particles !== _prevParticles || newParticleColor !== _prevParticleColor) {
        _prevParticles = cfg.particles;
        _prevParticleColor = newParticleColor;
        if (_particleAnim) cancelAnimationFrame(_particleAnim);
        if (cfg.particles) initParticles(newParticleColor);
        else { const c = document.getElementById('particles'); c.getContext('2d').clearRect(0,0,1920,1080); }
    }

    let st = document.getElementById('custom-style');
    if (!st) { st = document.createElement('style'); st.id = 'custom-style'; document.head.appendChild(st); }
    st.textContent = cfg.custom_css || '';

    applyVisualFX(cfg, el);
    applyClock(cfg);

    // Connect IRC for live data collection (mods/vips/subs/chat/raiders)
    const ch = (cfg.twitch_channel || '').toLowerCase().trim();
    if (ch && ch !== _creditsChannel) connectCreditsIRC(ch);
    // Poll server for followers collected via Twitch EventSub webhook
    if (ch && ch !== _followerPollChannel) startFollowerPolling(ch);
}

function initParticles(color) {
    const canvas = document.getElementById('particles');
    canvas.width = 1920; canvas.height = 1080;
    const ctx = canvas.getContext('2d');
    _particles = Array.from({length:60}, () => ({
        x: Math.random()*1920, y: Math.random()*1080,
        vx: (Math.random()-.5)*.5, vy: (Math.random()-.5)*.5,
        r: Math.random()*2+.5, alpha: Math.random()*.4+.1
    }));
    function draw() {
        ctx.clearRect(0,0,1920,1080);
        _particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0)p.x=1920; if(p.x>1920)p.x=0;
            if(p.y<0)p.y=1080; if(p.y>1080)p.y=0;
            ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            const r=parseInt((color||'#7c3aed').slice(1,3),16), g=parseInt((color||'#7c3aed').slice(3,5),16), b=parseInt((color||'#7c3aed').slice(5,7),16);
            ctx.fillStyle = `rgba(${r},${g},${b},${p.alpha})`; ctx.fill();
        });
        _particleAnim = requestAnimationFrame(draw);
    }
    draw();
}

function connectSSE() {
    const es = new EventSource('/overlays/source/' + SCENE_ID + '/events');
    es.onmessage = e => { const msg = JSON.parse(e.data); if (msg.type === 'update') applyConfig(msg.config); else if (msg.type === 'channel_points_reaction') handleChannelPointsReaction(msg.reaction, msg.event); };
    es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
}

loadConfig().then(() => connectSSE());

window.addEventListener('message', e => {
    if (!e.data) return;
    if (e.data.type === 'preview-update') { applyConfig(e.data.config); return; }
    if (e.data.type === 'credits-test-fill') {
        // Populate liveData with test names so the preview shows something
        const sample = {
            mods:     ['CoolMod', 'AwesomeMod', 'BestMod'],
            vips:     ['TopVIP', 'VIPFan42', 'VIPPro'],
            subs:     ['SubFan1', 'SubFan2', 'SubFan3', 'SubGuy4', 'LoyalSub5', 'MonthSub6'],
            giftSubs: ['GiftGiver1', 'GenerousGuy'],
            raiders:  ['RaidLeader · 42 viewers'],
            chat:     ['Chatter1','Chatter2','Chatter3','Chatter4','Chatter5','Chatter6','Chatter7','Chatter8','Chatter9','Chatter10'],
        };
        Object.entries(sample).forEach(([k, names]) => { liveData[k].clear(); names.forEach(n => liveData[k].add(n)); });
        document.getElementById('creditsContent').innerHTML = buildCreditsHTML(config);
        clearTimeout(_scrollTimeout);
        _scrollTimeout = setTimeout(startScroll, 200);
    }
});
</script>
</body>
</html>
