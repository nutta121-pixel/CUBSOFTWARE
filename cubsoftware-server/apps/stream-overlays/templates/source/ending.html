<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>Ending Screen</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;}
#overlay{width:1920px;height:1080px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
--bg:#0a0a1a;--bg2:#0a1a0a;--accent:#00cc66;--text1:#fff;--text2:#88bbaa;--font:'Orbitron';font-family:var(--font),sans-serif;background:var(--bg);}
.bg-animated-gradient{animation:bgShift 8s ease infinite;background-size:400% 400% !important;}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

#overlay.minimal .scene-title{font-size:72px;font-weight:900;color:var(--text1);letter-spacing:4px;text-align:center;}
#overlay.minimal .scene-subtitle{font-size:28px;color:var(--text2);margin-top:12px;font-family:Poppins,sans-serif;text-align:center;}
#overlay.minimal .cta-text{font-size:36px;color:var(--accent);margin-top:20px;font-family:Poppins,sans-serif;font-weight:600;text-align:center;}
#overlay.minimal .divider{width:400px;height:2px;background:var(--accent);margin:24px auto;opacity:.5;}

#overlay.neon::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:60px 60px;}
#overlay.neon .scene-card{border:1px solid var(--accent);border-radius:12px;padding:60px 80px;box-shadow:0 0 60px color-mix(in srgb,var(--accent) 30%,transparent);text-align:center;}
#overlay.neon .scene-title{font-size:64px;font-weight:900;color:var(--text1);text-shadow:0 0 30px var(--accent);letter-spacing:4px;}
#overlay.neon .scene-subtitle{font-size:24px;color:var(--text2);margin-top:12px;font-family:Poppins,sans-serif;}
#overlay.neon .cta-text{font-size:32px;color:var(--accent);margin-top:16px;text-shadow:0 0 20px var(--accent);}
#overlay.neon .divider{width:80%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:24px auto;}

#overlay.retro::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;}
#overlay.retro .scene-title{font-size:60px;color:var(--accent);font-family:'Share Tech Mono',monospace;letter-spacing:6px;text-align:center;}
#overlay.retro .scene-subtitle{font-size:22px;color:var(--text2);font-family:'Share Tech Mono',monospace;text-align:center;margin-top:8px;}
#overlay.retro .cta-text{font-size:28px;color:var(--text1);font-family:'Share Tech Mono',monospace;margin-top:16px;text-align:center;}
#overlay.retro .divider{width:80%;height:1px;background:var(--accent);opacity:.4;margin:20px auto;}

#overlay.cozy .scene-card{background:rgba(255,255,255,.06);border-radius:24px;padding:60px 80px;border:1px solid rgba(255,255,255,.1);text-align:center;}
#overlay.cozy .scene-title{font-size:64px;color:var(--text1);font-family:Pacifico,cursive;}
#overlay.cozy .scene-subtitle{font-size:26px;color:var(--text2);margin-top:16px;font-family:Poppins,sans-serif;}
#overlay.cozy .cta-text{font-size:30px;color:var(--accent);margin-top:16px;font-family:Poppins,sans-serif;font-weight:600;}
#overlay.cozy .divider{width:200px;height:3px;background:var(--accent);border-radius:3px;margin:20px auto;opacity:.6;}

#overlay.gradient .scene-title{font-size:72px;font-weight:900;background:linear-gradient(135deg,var(--text1),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;text-align:center;}
#overlay.gradient .scene-subtitle{font-size:26px;color:var(--text2);margin-top:12px;font-family:Poppins,sans-serif;text-align:center;}
#overlay.gradient .cta-text{font-size:32px;color:var(--accent);margin-top:16px;text-align:center;}
#overlay.gradient .divider{width:400px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:20px auto;}

#overlay.gaming::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--accent) 15%,transparent) 0%,transparent 70%);}
#overlay.gaming .scene-title{font-size:80px;font-weight:900;color:var(--text1);text-transform:uppercase;letter-spacing:8px;text-align:center;}
#overlay.gaming .scene-subtitle{font-size:24px;color:var(--accent);margin-top:16px;font-family:Rajdhani,sans-serif;letter-spacing:4px;text-align:center;}
#overlay.gaming .cta-text{font-size:28px;color:var(--text2);margin-top:16px;font-family:Rajdhani,sans-serif;letter-spacing:2px;text-align:center;}
#overlay.gaming .divider{width:60%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:20px auto;}

.scene-card{position:relative;z-index:2;max-width:1200px;width:90%;}
.logo-img{max-width:180px;max-height:100px;object-fit:contain;display:none;margin:0 auto 24px;}
.logo-img.visible{display:block;}
.social-row{display:flex;gap:20px;justify-content:center;margin-top:28px;flex-wrap:wrap;}
.social-link{display:flex;align-items:center;gap:8px;color:var(--text2);}
.social-link .platform{color:var(--accent);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:1px;}
.social-link .handle{font-size:16px;font-family:Poppins,sans-serif;}
#particles{position:absolute;inset:0;z-index:1;pointer-events:none;}
#confetti-canvas{position:absolute;inset:0;z-index:3;pointer-events:none;}
.scene-card{animation:fadeIn 1.5s ease forwards;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Boogaloo&family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Creepster&family=DM+Sans:wght@400;500;700&family=Exo+2:wght@400;600;700&family=Fira+Code:wght@400;500&family=Fredoka+One&family=Goldman:wght@400;700&family=Inter:wght@400;500;600;700&family=Lobster&family=Lora:wght@400;600;700&family=Manrope:wght@400;500;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&family=Pacifico&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Press+Start+2P&family=Quantico:wght@400;700&family=Rajdhani:wght@400;500;600;700&family=Righteous&family=Roboto:wght@400;500;700&family=Russo+One&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;600&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlays/static/css/overlays-effects.css?v={{ v }}">
</head>
<body>
<div id="overlay" class="minimal">
    <canvas id="particles"></canvas>
    <canvas id="bg-effects" width="1920" height="1080"></canvas>
    <canvas id="confetti-canvas"></canvas>
    <div class="scene-card">
        <img id="logoImg" class="logo-img" src="" alt="">
        <div id="sceneTitle" class="scene-title">Thanks for Watching!</div>
        <div class="divider"></div>
        <div id="sceneSubtitle" class="scene-subtitle">Stream ending — see you next time!</div>
        <div id="ctaText" class="cta-text">Follow for more!</div>
        <div id="socialRow" class="social-row"></div>
    </div>
</div>
<script src="/overlays/static/js/overlays-effects.js?v={{ v }}"></script>
<script>
const SCENE_ID='{{ scene_id }}';
const DISCORD_USER_ID='{{ discord_user_id }}';
let particleAnim=null,confettiAnim=null,confettiPieces=[];
async function loadConfig(){try{const r=await fetch('/overlays/api/scenes/'+SCENE_ID+'/config');if(r.ok){const c=await r.json();applyConfig(c);}}catch(e){}}
function applyConfig(cfg){
    const el=document.getElementById('overlay');
    el.className=cfg.template||'minimal';
    const bt=cfg.background_type||'gradient';
    if(bt==='solid')el.style.background=cfg.bg_color||'#0a0a1a';
    else if(bt==='animated-gradient'){el.style.background=`linear-gradient(${cfg.bg_gradient_angle||45}deg,${cfg.bg_gradient_from||'#0a1a0a'},${cfg.bg_gradient_to||'#0a0a2e'},${cfg.bg_gradient_from||'#0a1a0a'})`;el.style.backgroundSize='400% 400%';el.classList.add('bg-animated-gradient');}
    else el.style.background=`linear-gradient(${cfg.bg_gradient_angle||45}deg,${cfg.bg_gradient_from||'#0a1a0a'},${cfg.bg_gradient_to||'#0a0a2e'})`;
    el.style.setProperty('--accent',cfg.accent_color||'#00cc66');
    el.style.setProperty('--text1',cfg.text_primary||'#fff');
    el.style.setProperty('--text2',cfg.text_secondary||'#88bbaa');
    applyFontConfig(cfg, el);
    applyAnimationClass(cfg, el);
    document.getElementById('sceneTitle').textContent=cfg.title||'Thanks for Watching!';
    document.getElementById('sceneSubtitle').textContent=cfg.subtitle||'';
    document.getElementById('ctaText').textContent=cfg.cta_text||'Follow for more!';
    const li=document.getElementById('logoImg');if(cfg.logo_url){li.src=cfg.logo_url;li.classList.add('visible');}else li.classList.remove('visible');
    applyTextEffect(cfg, el); applyLogoEffect(cfg, el); applyBackgroundEffect(cfg); applyBranding(cfg);
    const social=cfg.social||{},sr=document.getElementById('socialRow');sr.innerHTML='';
    Object.entries(social).forEach(([p,h])=>{if(!h)return;const d=document.createElement('div');d.className='social-link';d.innerHTML=`<span class="platform">${p}</span><span class="handle">${h}</span>`;sr.appendChild(d);});
    if(particleAnim)cancelAnimationFrame(particleAnim);
    if(confettiAnim)cancelAnimationFrame(confettiAnim);
    if(cfg.particles)initParticles(cfg.particle_color||cfg.accent_color||'#00cc66');
    initConfetti(cfg.accent_color||'#00cc66');
    let s=document.getElementById('custom-style');if(!s){s=document.createElement('style');s.id='custom-style';document.head.appendChild(s);}s.textContent=cfg.custom_css||'';
    applyVisualFX(cfg, el);
    applyClock(cfg);
    applyGoalBar(cfg);
    applyViewerQueue(cfg);
    if(cfg.show_alerts)initSceneAlerts(DISCORD_USER_ID,cfg.scene_alert_position);
}
function initParticles(color){
    const c=document.getElementById('particles');c.width=1920;c.height=1080;const ctx=c.getContext('2d');
    const pts=Array.from({length:60},()=>({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+.5,a:Math.random()*.4+.1}));
    function draw(){ctx.clearRect(0,0,1920,1080);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=1920;if(p.x>1920)p.x=0;if(p.y<0)p.y=1080;if(p.y>1080)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);const r=parseInt(color.slice(1,3)||'00',16),g=parseInt(color.slice(3,5)||'cc',16),b=parseInt(color.slice(5,7)||'66',16);ctx.fillStyle=`rgba(${r},${g},${b},${p.a})`;ctx.fill();});particleAnim=requestAnimationFrame(draw);}
    draw();
}
function initConfetti(color){
    const c=document.getElementById('confetti-canvas');c.width=1920;c.height=1080;const ctx=c.getContext('2d');
    const colors=[color,'#fff','#ffcc00',color+'99'];
    confettiPieces=Array.from({length:120},()=>({x:Math.random()*1920,y:-20-Math.random()*100,w:8+Math.random()*8,h:4+Math.random()*4,speed:1+Math.random()*2,angle:Math.random()*Math.PI*2,spin:(.5-Math.random())*.1,col:colors[Math.floor(Math.random()*colors.length)],alpha:1}));
    function draw(){ctx.clearRect(0,0,1920,1080);confettiPieces.forEach(p=>{p.y+=p.speed;p.angle+=p.spin;if(p.y>1100){p.y=-20;p.x=Math.random()*1920;}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.globalAlpha=p.alpha;ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});confettiAnim=requestAnimationFrame(draw);}
    draw();
}
function connectSSE(){const es=new EventSource('/overlays/source/'+SCENE_ID+'/events');es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='update')applyConfig(m.config);};es.onerror=()=>{es.close();setTimeout(connectSSE,3000);};}
loadConfig().then(()=>connectSSE());
</script>
</body>
</html>
