<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>Hype Train</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
#overlay{width:1920px;height:1080px;position:relative;}
#hypeBox{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:700px;
  background:rgba(10,10,26,0.92);border-radius:14px;padding:22px 28px;
  backdrop-filter:blur(10px);border:1px solid rgba(255,102,0,.3);
  box-shadow:0 0 40px rgba(255,102,0,.2);
  transition:opacity .5s;display:none;}
#hypeBox.active{display:block;animation:hypeIn .5s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes hypeIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.ht-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ht-title{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:#fff;letter-spacing:2px;}
.ht-level{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;
  color:var(--accent);text-shadow:0 0 20px var(--accent);}
.ht-bar-wrap{height:12px;background:rgba(255,102,0,.15);border-radius:6px;overflow:hidden;margin-bottom:10px;}
.ht-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),#ffcc00);
  transition:width 1s cubic-bezier(.22,1,.36,1);box-shadow:0 0 12px var(--accent);}
@keyframes barPulse{0%,100%{box-shadow:0 0 12px var(--accent)}50%{box-shadow:0 0 30px var(--accent),0 0 60px var(--accent)}}
.ht-bar.pulse{animation:barPulse 1.5s ease infinite;}
.ht-stats{display:flex;gap:24px;font-family:'Poppins',sans-serif;font-size:13px;color:#aaa;}
.ht-stat-val{color:#fff;font-weight:700;font-size:15px;}
.ht-contribs{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.ht-contrib{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;
  background:rgba(255,102,0,.15);border:1px solid rgba(255,102,0,.3);color:#fff;}
.ht-ended{text-align:center;padding:8px 0;font-family:'Orbitron',sans-serif;
  font-size:14px;color:var(--accent);letter-spacing:2px;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlays/static/css/overlays-effects.css?v={{ v }}">
</head>
<body>
<div id="overlay"><div id="hypeBox"></div></div>
<script src="/overlays/static/js/overlays-effects.js?v={{ v }}"></script>
<script>
const SCENE_ID='{{ scene_id }}';
const DISCORD_USER_ID='{{ discord_user_id }}';
let cfg={};
let hideTimer=null;
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}

function renderHype(state) {
    const box=document.getElementById('hypeBox');
    const accent=cfg.accent_color||'#ff6600';
    document.documentElement.style.setProperty('--accent',accent);
    if(!state||(!state.active&&!state.ended&&cfg.hide_when_inactive!==false)){box.classList.remove('active');return;}
    box.classList.add('active');
    const pct=state.goal>0?Math.min(100,Math.round((state.progress||state.total||0)/state.goal*100)):0;
    const contribsHtml=cfg.show_contributors&&state.top_contributions?
        state.top_contributions.slice(0,5).map(c=>`<div class="ht-contrib">${esc(c.user_name||'?')} · ${esc(c.total||0)}</div>`).join(''):'';
    box.innerHTML=`
      <div class="ht-header">
        <div class="ht-title">🚂 ${esc(cfg.title||'HYPE TRAIN!')}</div>
        ${cfg.show_level?`<div class="ht-level">LVL ${state.level||1}</div>`:''}
      </div>
      <div class="ht-bar-wrap"><div class="ht-bar${cfg.animation==='pulse'?' pulse':''}" style="width:${pct}%;background:linear-gradient(90deg,${accent},#ffcc00)"></div></div>
      <div class="ht-stats">
        ${cfg.show_goal?`<div><div style="font-size:11px">PROGRESS</div><div class="ht-stat-val">${pct}%</div></div>`:''}
        <div><div style="font-size:11px">TOTAL</div><div class="ht-stat-val">${state.total||0}</div></div>
        ${state.last_contribution?`<div><div style="font-size:11px">LAST</div><div class="ht-stat-val">${esc(state.last_contribution.user_name||'?')}</div></div>`:''}
      </div>
      ${contribsHtml?`<div class="ht-contribs">${contribsHtml}</div>`:''}
      ${state.ended?`<div class="ht-ended">🎉 HYPE TRAIN ENDED — LEVEL ${state.level||1}!</div>`:''}
    `;
    if(state.ended){clearTimeout(hideTimer);hideTimer=setTimeout(()=>box.classList.remove('active'),8000);}
}

function applyConfig(c){cfg=c;document.documentElement.style.setProperty('--accent',c.accent_color||'#ff6600');}

let htLastTs=0;
function connectHype(){
    const es=new EventSource('/overlays/hype-train/'+DISCORD_USER_ID+'/events');
    es.onmessage=e=>{
        try{const m=JSON.parse(e.data);if(m.type==='update')renderHype(m.data);}catch(_){}
    };
    es.onerror=()=>{es.close();setTimeout(connectHype,3000);};
}
async function loadConfig(){try{const r=await fetch('/overlays/api/scenes/'+SCENE_ID+'/config');if(r.ok)applyConfig(await r.json());}catch(e){}}
function connectSSE(){const es=new EventSource('/overlays/source/'+SCENE_ID+'/events');es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='update')applyConfig(m.config);};es.onerror=()=>{es.close();setTimeout(connectSSE,3000);};}
loadConfig().then(()=>{connectSSE();connectHype();});
</script>
</body></html>
