<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>Leaderboard</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
#overlay{width:1920px;height:1080px;position:relative;}
#lbBox{position:absolute;top:20px;left:20px;width:400px;}
.lb-title{font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.lb-title::after{content:'';flex:1;height:1px;background:var(--accent);opacity:.3;}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:6px;
  border-radius:8px;background:rgba(10,10,26,0.85);backdrop-filter:blur(6px);
  border-left:3px solid var(--accent);animation:lbIn .5s cubic-bezier(.22,1,.36,1) both;}
.lb-row:nth-child(2){animation-delay:.05s}.lb-row:nth-child(3){animation-delay:.1s}
.lb-row:nth-child(4){animation-delay:.15s}.lb-row:nth-child(5){animation-delay:.2s}
@keyframes lbIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.lb-rank{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;width:32px;text-align:center;flex-shrink:0;}
.lb-name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-amount{font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px;color:var(--accent);flex-shrink:0;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlays/static/css/overlays-effects.css?v={{ v }}">
</head>
<body>
<div id="overlay"><div id="lbBox"></div></div>
<script src="/overlays/static/js/overlays-effects.js?v={{ v }}"></script>
<script>
const SCENE_ID='{{ scene_id }}';
const DISCORD_USER_ID='{{ discord_user_id }}';
let cfg={};
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}

const RANK_ICONS=['🥇','🥈','🥉','4','5','6','7','8','9','10'];

async function loadLeaderboard() {
    try {
        const period = cfg.period||'all';
        const count = cfg.max_entries||5;
        const r = await fetch(`/overlays/api/leaderboard/${DISCORD_USER_ID}?period=${period}&count=${count}`);
        if(!r.ok) return;
        const data = await r.json();
        renderLB(data.data||[]);
    } catch(e){}
}

function renderLB(entries) {
    const box=document.getElementById('lbBox');
    const accent=cfg.accent_color||'#ffcc00';
    document.documentElement.style.setProperty('--accent',accent);
    const rankColors=[cfg.rank1_color||'#ffd700',cfg.rank2_color||'#c0c0c0',cfg.rank3_color||'#cd7f32'];
    const font=cfg.font||'Orbitron';
    const fs=(cfg.font_size||20)+'px';
    let html=`<div class="lb-title">${esc(cfg.title||'Top Cheerers')}</div>`;
    entries.forEach((e,i)=>{
        const rc=i<3?rankColors[i]:accent;
        const icon=cfg.show_rank_icons?(i<3?RANK_ICONS[i]:(i+1)):(i+1);
        const amount=cfg.show_amounts?(cfg.leaderboard_type==='bits'?`${e.score} bits`:`${e.score} gifts`):'';
        html+=`<div class="lb-row" style="border-left-color:${rc}">
          <div class="lb-rank" style="color:${rc}">${icon}</div>
          <div class="lb-name" style="font-family:'${font}',sans-serif;font-size:${fs};color:#fff">${esc(e.user_name||e.user_login||'?')}</div>
          ${amount?`<div class="lb-amount" style="color:${rc}">${esc(amount)}</div>`:''}
        </div>`;
    });
    box.innerHTML=html;
}

function applyConfig(c) {
    cfg=c;
    document.documentElement.style.setProperty('--accent',c.accent_color||'#ffcc00');
    loadLeaderboard();
}

async function loadConfig(){try{const r=await fetch('/overlays/api/scenes/'+SCENE_ID+'/config');if(r.ok)applyConfig(await r.json());}catch(e){}}
function connectSSE(){const es=new EventSource('/overlays/source/'+SCENE_ID+'/events');es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='update')applyConfig(m.config);};es.onerror=()=>{es.close();setTimeout(connectSSE,3000);};}
loadConfig().then(connectSSE);
setInterval(loadLeaderboard,60000);
</script>
</body></html>
