<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>Offline</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;}
#overlay{width:1920px;height:1080px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
--bg:#0a0a0a;--bg2:#1a1a2e;--accent:#5865f2;--text1:#fff;--text2:#888;--font:'Orbitron';font-family:var(--font),sans-serif;background:var(--bg);}

#overlay.minimal .scene-card{text-align:center;}
#overlay.minimal .offline-badge{display:inline-block;font-size:18px;letter-spacing:8px;color:var(--text2);opacity:.6;margin-bottom:20px;}
#overlay.minimal .scene-title{font-size:72px;font-weight:900;color:var(--text1);letter-spacing:4px;}
#overlay.minimal .scene-subtitle{font-size:26px;color:var(--text2);margin-top:12px;font-family:Poppins,sans-serif;}
#overlay.minimal .next-stream{font-size:24px;color:var(--accent);margin-top:20px;font-family:Poppins,sans-serif;}
#overlay.minimal .divider{width:300px;height:2px;background:var(--accent);opacity:.3;margin:24px auto;}

#overlay.neon::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:60px 60px;}
#overlay.neon .scene-card{border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:60px 80px;box-shadow:0 0 40px rgba(0,0,0,.5);text-align:center;}
#overlay.neon .offline-badge{font-size:16px;letter-spacing:8px;color:var(--text2);opacity:.5;margin-bottom:20px;display:block;}
#overlay.neon .scene-title{font-size:68px;font-weight:900;color:var(--text1);letter-spacing:4px;}
#overlay.neon .scene-subtitle{font-size:24px;color:var(--text2);margin-top:12px;font-family:Poppins,sans-serif;}
#overlay.neon .next-stream{font-size:22px;color:var(--accent);margin-top:16px;text-shadow:0 0 12px var(--accent);}
#overlay.neon .divider{width:80%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:20px auto;opacity:.5;}

#overlay.retro::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 2px,rgba(0,0,0,.12) 4px);pointer-events:none;}
#overlay.retro .scene-title{font-size:60px;color:var(--text2);font-family:'Share Tech Mono',monospace;letter-spacing:6px;text-align:center;opacity:.6;}
#overlay.retro .scene-subtitle{font-size:22px;color:var(--text1);font-family:'Share Tech Mono',monospace;text-align:center;margin-top:8px;}
#overlay.retro .next-stream{font-size:18px;color:var(--accent);font-family:'Share Tech Mono',monospace;text-align:center;margin-top:16px;}
#overlay.retro .divider{width:80%;height:1px;background:var(--accent);opacity:.3;margin:20px auto;}
#overlay.retro .offline-badge{font-size:14px;letter-spacing:6px;color:var(--accent);font-family:'Share Tech Mono',monospace;text-align:center;display:block;margin-bottom:16px;opacity:.5;}

#overlay.cozy .scene-card{background:rgba(255,255,255,.04);border-radius:24px;padding:60px 80px;border:1px solid rgba(255,255,255,.08);text-align:center;}
#overlay.cozy .offline-badge{font-size:16px;color:var(--text2);margin-bottom:16px;font-family:Poppins,sans-serif;display:block;opacity:.6;}
#overlay.cozy .scene-title{font-size:64px;color:var(--text1);font-family:Pacifico,cursive;}
#overlay.cozy .scene-subtitle{font-size:24px;color:var(--text2);margin-top:12px;font-family:Poppins,sans-serif;}
#overlay.cozy .next-stream{font-size:22px;color:var(--accent);margin-top:16px;font-family:Poppins,sans-serif;font-weight:600;}
#overlay.cozy .divider{width:200px;height:3px;background:var(--accent);border-radius:3px;margin:20px auto;opacity:.4;}

#overlay.gradient .scene-title{font-size:72px;font-weight:900;background:linear-gradient(135deg,var(--text2),var(--text1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;text-align:center;opacity:.8;}
#overlay.gradient .scene-subtitle{font-size:26px;color:var(--text2);margin-top:12px;font-family:Poppins,sans-serif;text-align:center;}
#overlay.gradient .next-stream{font-size:22px;color:var(--accent);margin-top:16px;text-align:center;}
#overlay.gradient .offline-badge{font-size:16px;color:var(--text2);text-align:center;display:block;margin-bottom:16px;opacity:.5;letter-spacing:6px;}
#overlay.gradient .divider{width:400px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:20px auto;opacity:.4;}

#overlay.gaming::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--accent) 8%,transparent) 0%,transparent 60%);}
#overlay.gaming .scene-title{font-size:80px;font-weight:900;color:var(--text1);text-transform:uppercase;letter-spacing:10px;text-align:center;opacity:.5;}
#overlay.gaming .scene-subtitle{font-size:24px;color:var(--text2);font-family:Rajdhani,sans-serif;letter-spacing:4px;text-align:center;margin-top:12px;}
#overlay.gaming .next-stream{font-size:20px;color:var(--accent);font-family:Rajdhani,sans-serif;letter-spacing:3px;text-align:center;margin-top:16px;}
#overlay.gaming .offline-badge{font-size:14px;color:var(--text2);letter-spacing:8px;text-align:center;display:block;margin-bottom:16px;opacity:.4;}
#overlay.gaming .divider{width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:20px auto;opacity:.4;}

#particles{position:absolute;inset:0;z-index:1;pointer-events:none;}
.scene-card{position:relative;z-index:2;max-width:1200px;width:90%;}
.social-row{display:flex;gap:20px;justify-content:center;margin-top:28px;flex-wrap:wrap;}
.social-link{display:flex;align-items:center;gap:8px;color:var(--text2);}
.social-link .platform{color:var(--accent);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:1px;}
.social-link .handle{font-size:16px;font-family:Poppins,sans-serif;}
.logo-img{max-width:160px;max-height:90px;object-fit:contain;display:none;margin:0 auto 20px;}
.logo-img.visible{display:block;}
.scene-card{animation:fadeIn 1.5s ease forwards;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Boogaloo&family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Creepster&family=DM+Sans:wght@400;500;700&family=Exo+2:wght@400;600;700&family=Fira+Code:wght@400;500&family=Fredoka+One&family=Goldman:wght@400;700&family=Inter:wght@400;500;600;700&family=Lobster&family=Lora:wght@400;600;700&family=Manrope:wght@400;500;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&family=Pacifico&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Press+Start+2P&family=Quantico:wght@400;700&family=Rajdhani:wght@400;500;600;700&family=Righteous&family=Roboto:wght@400;500;700&family=Russo+One&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;600&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlays/static/css/overlays-effects.css?v={{ v }}">
</head>
<body>
<div id="overlay" class="minimal">
    <canvas id="particles"></canvas>
    <canvas id="bg-effects" width="1920" height="1080"></canvas>
    <div class="scene-card">
        <img id="logoImg" class="logo-img" src="" alt="">
        <span class="offline-badge">● OFFLINE</span>
        <div id="sceneTitle" class="scene-title">Offline</div>
        <div class="divider"></div>
        <div id="sceneSubtitle" class="scene-subtitle">Thanks for stopping by!</div>
        <div id="nextStream" class="next-stream"></div>
        <div id="socialRow" class="social-row"></div>
    </div>
</div>
{% if capture_mode %}<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>{% endif %}
<script src="/overlays/static/js/overlays-effects.js?v={{ v }}"></script>
<script>
const SCENE_ID='{{ scene_id }}';
const DISCORD_USER_ID='{{ discord_user_id }}';
async function loadConfig(){try{const r=await fetch('/overlays/api/scenes/'+SCENE_ID+'/config');if(r.ok){const c=await r.json();applyConfig(c);}}catch(e){}}
function applyConfig(cfg){
    const el=document.getElementById('overlay');
    el.className=cfg.template||'minimal';
    const bt=cfg.background_type||'gradient';
    if(bt==='solid')el.style.background=cfg.bg_color||'#0a0a0a';
    else el.style.background=`linear-gradient(${cfg.bg_gradient_angle||180}deg,${cfg.bg_gradient_from||'#0a0a0a'},${cfg.bg_gradient_to||'#1a1a2e'})`;
    el.style.setProperty('--accent',cfg.accent_color||'#5865f2');
    el.style.setProperty('--text1',cfg.text_primary||'#fff');
    el.style.setProperty('--text2',cfg.text_secondary||'#888');
    applyFontConfig(cfg, el);
    applyAnimationClass(cfg, el);
    document.getElementById('sceneTitle').textContent=cfg.title||'Offline';
    document.getElementById('sceneSubtitle').textContent=cfg.subtitle||'';
    const ns=document.getElementById('nextStream');
    if(cfg.next_stream){ns.textContent='Next stream: '+cfg.next_stream;ns.style.display='block';}else ns.style.display='none';
    const li=document.getElementById('logoImg');if(cfg.logo_url){li.src=cfg.logo_url;li.classList.add('visible');}else li.classList.remove('visible');
    applyTextEffect(cfg, el); applyLogoEffect(cfg, el); applyBackgroundEffect(cfg); applyBranding(cfg);
    const social=cfg.social||{},sr=document.getElementById('socialRow');sr.innerHTML='';
    Object.entries(social).forEach(([p,h])=>{if(!h)return;const d=document.createElement('div');d.className='social-link';d.innerHTML=`<span class="platform">${p}</span><span class="handle">${h}</span>`;sr.appendChild(d);});
    let s=document.getElementById('custom-style');if(!s){s=document.createElement('style');s.id='custom-style';document.head.appendChild(s);}s.textContent=cfg.custom_css||'';
    applyVisualFX(cfg, el);
    applyClock(cfg);
    applyGoalBar(cfg);
    applyViewerQueue(cfg);
    if(cfg.show_alerts)initSceneAlerts(DISCORD_USER_ID,cfg.scene_alert_position);
}
function connectSSE(){const es=new EventSource('/overlays/source/'+SCENE_ID+'/events');es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='update')applyConfig(m.config);};es.onerror=()=>{es.close();setTimeout(connectSSE,3000);};}
{% if capture_mode %}
loadConfig().then(() => {
    setTimeout(() => {
        html2canvas(document.getElementById('overlay'), {
            width: 1920, height: 1080, scale: 1, useCORS: true, allowTaint: false,
            backgroundColor: document.getElementById('overlay').style.background || '#0a0a0a'
        }).then(canvas => {
            const a = document.createElement('a');
            a.download = 'offline-screen.png';
            a.href = canvas.toDataURL('image/png');
            a.click();
        }).catch(e => { alert('Screenshot failed: ' + e.message); });
    }, 1500);
});
{% else %}
loadConfig().then(()=>connectSSE());
{% endif %}
</script>
</body></html>
