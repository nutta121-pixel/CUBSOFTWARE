<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>Poll Display</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
#overlay{width:1920px;height:1080px;position:relative;}
#pollBox{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:600px;
  background:rgba(10,10,26,0.92);border-radius:14px;padding:24px 28px;
  backdrop-filter:blur(10px);border:1px solid rgba(124,58,237,.3);
  box-shadow:0 0 40px rgba(124,58,237,.2);display:none;}
#pollBox.active{display:block;animation:pollIn .5s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes pollIn{from{opacity:0;transform:translateX(-50%) scale(.95)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.poll-title{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:#fff;
  letter-spacing:1px;margin-bottom:18px;line-height:1.3;}
.poll-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.poll-choice{margin-bottom:12px;}
.poll-choice-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.poll-choice-name{font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;color:#fff;}
.poll-choice-pct{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;}
.poll-bar-wrap{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
.poll-bar{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.22,1,.36,1);}
.poll-votes{font-size:11px;color:#888;margin-top:2px;}
.poll-ended{text-align:center;font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:2px;color:#888;margin-top:12px;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlays/static/css/overlays-effects.css?v={{ v }}">
</head>
<body>
<div id="overlay"><div id="pollBox"></div></div>
<script src="/overlays/static/js/overlays-effects.js?v={{ v }}"></script>
<script>
const SCENE_ID='{{ scene_id }}';
const DISCORD_USER_ID='{{ discord_user_id }}';
let cfg={};
let hideTimer=null;
function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}

function renderPoll(state) {
    const box=document.getElementById('pollBox');
    if(!state||(!state.active&&!state.ended&&cfg.hide_when_inactive!==false)){box.classList.remove('active');return;}
    box.classList.add('active');
    const accent=cfg.accent_color||'#7c3aed';
    document.documentElement.style.setProperty('--accent',accent);
    const choices=state.choices||[];
    const total=choices.reduce((s,c)=>s+(c.votes||c.channel_points_votes||0),0)||1;
    const defColors=cfg.choice_colors||['#7c3aed','#00cc66','#ff6600','#00ccff','#ff3366'];
    let html=`<div class="poll-label">📊 POLL${state.ended?' · ENDED':''}</div>
      <div class="poll-title">${esc(state.title||'')}</div>`;
    choices.forEach((c,i)=>{
        const votes=c.votes||c.channel_points_votes||0;
        const pct=Math.round(votes/total*100);
        const col=defColors[i%defColors.length];
        html+=`<div class="poll-choice">
          <div class="poll-choice-header">
            <div class="poll-choice-name" style="font-family:'${cfg.choice_font||'Poppins'}',sans-serif">${esc(c.title)}</div>
            ${cfg.show_percentage?`<div class="poll-choice-pct" style="color:${col}">${pct}%</div>`:''}
          </div>
          <div class="poll-bar-wrap"><div class="poll-bar" style="width:${pct}%;background:${col}"></div></div>
          ${cfg.show_votes?`<div class="poll-votes">${votes.toLocaleString()} votes</div>`:''}
        </div>`;
    });
    if(state.ended) html+=`<div class="poll-ended">POLL ENDED</div>`;
    box.innerHTML=html;
    if(state.ended){clearTimeout(hideTimer);hideTimer=setTimeout(()=>box.classList.remove('active'),10000);}
}

function applyConfig(c){cfg=c;document.documentElement.style.setProperty('--accent',c.accent_color||'#7c3aed');}

function connectPoll(){
    const es=new EventSource('/overlays/poll/'+DISCORD_USER_ID+'/events');
    es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='update')renderPoll(m.data);}catch(_){}};
    es.onerror=()=>{es.close();setTimeout(connectPoll,3000);};
}
async function loadConfig(){try{const r=await fetch('/overlays/api/scenes/'+SCENE_ID+'/config');if(r.ok)applyConfig(await r.json());}catch(e){}}
function connectSSE(){const es=new EventSource('/overlays/source/'+SCENE_ID+'/events');es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='update')applyConfig(m.config);};es.onerror=()=>{es.close();setTimeout(connectSSE,3000);};}
loadConfig().then(()=>{connectSSE();connectPoll();});
</script>
</body></html>
