<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>Raid</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;}
#overlay{width:1920px;height:1080px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
--bg:#1a0a00;--bg2:#0a001a;--accent:#ff6600;--text1:#fff;--text2:#ffaa66;--font:'Orbitron';font-family:var(--font),sans-serif;background:var(--bg);}
.bg-animated-gradient{animation:bgShift 5s ease infinite;background-size:400% 400% !important;}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.scene-card{position:relative;z-index:2;max-width:1100px;width:90%;text-align:center;}
.logo-img{max-width:160px;max-height:90px;object-fit:contain;display:none;margin:0 auto 20px;}
.logo-img.visible{display:block;}
.raid-label{font-size:20px;letter-spacing:8px;color:var(--text2);margin-bottom:12px;font-family:Poppins,sans-serif;}
.scene-title{font-size:120px;font-weight:900;color:var(--accent);letter-spacing:8px;line-height:1;}
.raider-name{font-size:60px;font-weight:700;color:var(--text1);margin-top:8px;}
.raider-count{font-size:32px;color:var(--text2);margin-top:8px;font-family:Poppins,sans-serif;}
.scene-subtitle{font-size:28px;color:var(--text2);margin-top:12px;font-family:Poppins,sans-serif;}
.divider{width:500px;height:3px;background:var(--accent);margin:20px auto;border-radius:2px;}

#overlay.neon .scene-card{border:1px solid var(--accent);border-radius:12px;padding:60px 80px;box-shadow:0 0 80px color-mix(in srgb,var(--accent) 40%,transparent);}
#overlay.neon .scene-title{text-shadow:0 0 40px var(--accent),0 0 80px var(--accent);}
#overlay.neon::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:60px 60px;}

#overlay.retro::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;}
#overlay.retro .scene-title{font-family:'Share Tech Mono',monospace;font-size:100px;}
#overlay.retro .raider-name{font-family:'Share Tech Mono',monospace;}

#overlay.cozy .scene-card{background:rgba(255,255,255,.05);border-radius:24px;padding:60px 80px;border:1px solid rgba(255,255,255,.1);}
#overlay.cozy .scene-title{font-family:Pacifico,cursive;font-size:100px;}

#overlay.gradient .scene-title{background:linear-gradient(135deg,var(--accent),var(--text1),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:titleGrad 3s ease infinite;}
@keyframes titleGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

#overlay.gaming::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--accent) 25%,transparent) 0%,transparent 60%);}
#overlay.gaming .scene-title{text-transform:uppercase;font-size:130px;filter:drop-shadow(0 0 30px var(--accent));}

#particles{position:absolute;inset:0;z-index:1;pointer-events:none;}
.scene-card{animation:raidBounce 0.8s cubic-bezier(.36,.07,.19,.97) forwards;}
@keyframes raidBounce{0%{opacity:0;transform:scale(.3)}60%{transform:scale(1.08)}80%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
.bounce-anim .scene-card{animation:raidBounce 0.8s cubic-bezier(.36,.07,.19,.97) forwards;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Boogaloo&family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Creepster&family=DM+Sans:wght@400;500;700&family=Exo+2:wght@400;600;700&family=Fira+Code:wght@400;500&family=Fredoka+One&family=Goldman:wght@400;700&family=Inter:wght@400;500;600;700&family=Lobster&family=Lora:wght@400;600;700&family=Manrope:wght@400;500;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&family=Pacifico&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Press+Start+2P&family=Quantico:wght@400;700&family=Rajdhani:wght@400;500;600;700&family=Righteous&family=Roboto:wght@400;500;700&family=Russo+One&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;600&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlays/static/css/overlays-effects.css?v={{ v }}">
</head>
<body>
<div id="overlay" class="minimal bounce-anim">
    <canvas id="particles"></canvas>
    <canvas id="bg-effects" width="1920" height="1080"></canvas>
    <div class="scene-card">
        <img id="logoImg" class="logo-img" src="" alt="">
        <div class="raid-label">INCOMING RAID</div>
        <div id="sceneTitle" class="scene-title">RAID!</div>
        <div id="raiderName" class="raider-name">StreamerName</div>
        <div id="raiderCount" class="raider-count"></div>
        <div class="divider"></div>
        <div id="sceneSubtitle" class="scene-subtitle">Thanks for the raid!</div>
    </div>
</div>
<script src="/overlays/static/js/overlays-effects.js?v={{ v }}"></script>
<script>
const SCENE_ID='{{ scene_id }}';
const DISCORD_USER_ID='{{ discord_user_id }}';
let particleAnim=null;
async function loadConfig(){try{const r=await fetch('/overlays/api/scenes/'+SCENE_ID+'/config');if(r.ok){const c=await r.json();applyConfig(c);}}catch(e){}}
function applyConfig(cfg){
    const el=document.getElementById('overlay');
    el.className=(cfg.template||'minimal')+' bounce-anim';
    const bt=cfg.background_type||'animated-gradient';
    if(bt==='solid')el.style.background=cfg.bg_color||'#1a0a00';
    else if(bt==='animated-gradient'){el.style.background=`linear-gradient(${cfg.bg_gradient_angle||45}deg,${cfg.bg_gradient_from||'#2a0a00'},${cfg.bg_gradient_to||'#0a001a'},${cfg.bg_gradient_from||'#2a0a00'})`;el.style.backgroundSize='400% 400%';el.classList.add('bg-animated-gradient');}
    else el.style.background=`linear-gradient(${cfg.bg_gradient_angle||45}deg,${cfg.bg_gradient_from||'#2a0a00'},${cfg.bg_gradient_to||'#0a001a'})`;
    el.style.setProperty('--accent',cfg.accent_color||'#ff6600');
    el.style.setProperty('--text1',cfg.text_primary||'#fff');
    el.style.setProperty('--text2',cfg.text_secondary||'#ffaa66');
    applyFontConfig(cfg, el);
    applyAnimationClass(cfg, el);
    document.getElementById('sceneTitle').textContent=cfg.title||'RAID!';
    document.getElementById('sceneSubtitle').textContent=cfg.subtitle||'Thanks for the raid!';
    const rn=document.getElementById('raiderName');
    if(cfg.raider_name&&cfg.raider_name!=='YOUR_NAME'){rn.textContent=cfg.raider_name;rn.style.display='block';}else rn.style.display='none';
    const rc=document.getElementById('raiderCount');
    if(cfg.raider_count&&parseInt(cfg.raider_count)>0){rc.textContent=cfg.raider_count+' raiders incoming!';rc.style.display='block';}else rc.style.display='none';
    const li=document.getElementById('logoImg');if(cfg.logo_url){li.src=cfg.logo_url;li.classList.add('visible');}else li.classList.remove('visible');
    applyTextEffect(cfg, el); applyLogoEffect(cfg, el); applyBackgroundEffect(cfg); applyBranding(cfg);
    if(particleAnim)cancelAnimationFrame(particleAnim);
    if(cfg.particles)initParticles(cfg.particle_color||cfg.accent_color||'#ff6600');
    let s=document.getElementById('custom-style');if(!s){s=document.createElement('style');s.id='custom-style';document.head.appendChild(s);}s.textContent=cfg.custom_css||'';
    applyVisualFX(cfg, el);
    applyClock(cfg);
    applyGoalBar(cfg);
    applyViewerQueue(cfg);
    if(cfg.show_alerts)initSceneAlerts(DISCORD_USER_ID,cfg.scene_alert_position);
}
function initParticles(color){
    const c=document.getElementById('particles');c.width=1920;c.height=1080;const ctx=c.getContext('2d');
    const pts=Array.from({length:100},()=>({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,r:Math.random()*3+.5,a:Math.random()*.6+.2}));
    function draw(){ctx.clearRect(0,0,1920,1080);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=1920;if(p.x>1920)p.x=0;if(p.y<0)p.y=1080;if(p.y>1080)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);const r=parseInt(color.slice(1,3)||'ff',16),g=parseInt(color.slice(3,5)||'66',16),b=parseInt(color.slice(5,7)||'00',16);ctx.fillStyle=`rgba(${r},${g},${b},${p.a})`;ctx.fill();});particleAnim=requestAnimationFrame(draw);}
    draw();
}
function connectSSE(){const es=new EventSource('/overlays/source/'+SCENE_ID+'/events');es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='update')applyConfig(m.config);};es.onerror=()=>{es.close();setTimeout(connectSSE,3000);};}
loadConfig().then(()=>connectSSE());
</script>
</body></html>
