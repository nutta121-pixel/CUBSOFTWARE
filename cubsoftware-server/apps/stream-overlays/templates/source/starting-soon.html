<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Starting Soon</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a1a; }

#overlay {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    --bg: #0a0a1a; --bg2: #1a0a2e; --accent: #7c3aed;
    --text1: #fff; --text2: #a0a0c0; --font: 'Orbitron';
    font-family: var(--font), sans-serif;
    background: var(--bg);
    transition: background 1s ease, color 1s ease;
}

/* ─── Backgrounds ─── */
.bg-solid { background: var(--bg) !important; }
.bg-gradient { background: linear-gradient(var(--bg-angle, 135deg), var(--bg), var(--bg2)) !important; }
.bg-animated-gradient {
    background: linear-gradient(var(--bg-angle, 135deg), var(--bg), var(--bg2), var(--bg)) !important;
    background-size: 400% 400% !important;
    animation: bgShift 8s ease infinite;
}
@keyframes bgShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

/* ─── Template: minimal ─── */
#overlay.minimal .scene-card { text-align: center; }
#overlay.minimal .scene-title { font-size: 72px; font-weight: 900; color: var(--text1); letter-spacing: 4px; }
#overlay.minimal .scene-subtitle { font-size: 28px; color: var(--text2); margin-top: 12px; font-weight: 400; font-family: Poppins, sans-serif; }
#overlay.minimal .countdown-display { font-size: 96px; font-weight: 700; color: var(--accent); margin: 32px 0; letter-spacing: 6px; }
#overlay.minimal .divider { width: 300px; height: 2px; background: var(--accent); margin: 0 auto 32px; opacity: 0.5; }

/* ─── Template: neon ─── */
#overlay.neon .scene-card {
    border: 1px solid var(--accent); border-radius: 12px; padding: 60px 80px;
    box-shadow: 0 0 60px color-mix(in srgb, var(--accent) 30%, transparent),
                inset 0 0 60px color-mix(in srgb, var(--accent) 5%, transparent);
    text-align: center;
}
#overlay.neon::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events: none;
}
#overlay.neon .scene-title { font-size: 68px; font-weight: 900; color: var(--text1); text-shadow: 0 0 30px var(--accent); letter-spacing: 6px; }
#overlay.neon .scene-subtitle { font-size: 24px; color: var(--text2); margin-top: 12px; font-family: Poppins, sans-serif; }
#overlay.neon .countdown-display { font-size: 100px; font-weight: 700; color: var(--accent); text-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent); margin: 28px 0; letter-spacing: 8px; }
#overlay.neon .divider { width: 80%; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin: 0 auto 28px; }

/* ─── Template: retro ─── */
#overlay.retro::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.15) 2px, rgba(0,0,0,.15) 4px);
    animation: scanMove 8s linear infinite;
}
@keyframes scanMove { from{background-position:0 0} to{background-position:0 100%} }
#overlay.retro .scene-title { font-size: 60px; font-weight: 700; color: var(--accent); font-family: 'Share Tech Mono', monospace; text-transform: uppercase; letter-spacing: 8px; }
#overlay.retro .scene-subtitle { font-size: 20px; color: var(--text2); font-family: 'Share Tech Mono', monospace; margin-top: 8px; }
#overlay.retro .countdown-display { font-size: 90px; color: var(--text1); font-family: 'Share Tech Mono', monospace; margin: 24px 0; letter-spacing: 4px; }
#overlay.retro .divider { width: 100%; height: 1px; background: var(--accent); opacity: 0.4; margin: 0 auto 24px; }

/* ─── Template: cozy ─── */
#overlay.cozy .scene-card {
    background: rgba(255,255,255,.05); border-radius: 24px; padding: 60px 80px;
    border: 1px solid rgba(255,255,255,.1); box-shadow: 0 20px 80px rgba(0,0,0,.3);
    text-align: center;
}
#overlay.cozy .scene-title { font-size: 64px; font-weight: 700; color: var(--text1); font-family: Pacifico, cursive; }
#overlay.cozy .scene-subtitle { font-size: 26px; color: var(--text2); margin-top: 16px; font-family: Poppins, sans-serif; }
#overlay.cozy .countdown-display { font-size: 88px; color: var(--accent); margin: 28px 0; font-family: Poppins, sans-serif; font-weight: 700; }
#overlay.cozy .divider { width: 200px; height: 3px; background: var(--accent); border-radius: 3px; margin: 0 auto 28px; opacity: 0.6; }

/* ─── Template: gradient ─── */
#overlay.gradient .scene-title { font-size: 72px; font-weight: 900; background: linear-gradient(135deg, var(--text1), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; }
#overlay.gradient .scene-subtitle { font-size: 26px; color: var(--text2); margin-top: 12px; font-family: Poppins, sans-serif; }
#overlay.gradient .countdown-display { font-size: 100px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--text1)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 28px 0; letter-spacing: 6px; }
#overlay.gradient .divider { width: 300px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin: 0 auto 28px; }

/* ─── Template: gaming ─── */
#overlay.gaming::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 15%, transparent) 0%, transparent 70%);
    pointer-events: none;
}
#overlay.gaming .scene-card { text-align: center; }
#overlay.gaming .scene-title { font-size: 80px; font-weight: 900; color: var(--text1); text-transform: uppercase; letter-spacing: 8px; clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%); background: rgba(255,255,255,.05); padding: 8px 40px; display: inline-block; }
#overlay.gaming .scene-subtitle { font-size: 24px; color: var(--accent); margin-top: 16px; font-family: Rajdhani, sans-serif; letter-spacing: 4px; }
#overlay.gaming .countdown-display { font-size: 96px; font-weight: 700; color: var(--accent); margin: 28px 0; letter-spacing: 6px; filter: drop-shadow(0 0 20px var(--accent)); }
#overlay.gaming .divider { width: 80%; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin: 0 auto 24px; }

/* ─── Shared scene content ─── */
.scene-card { position: relative; z-index: 2; max-width: 1200px; width: 90%; }
.logo-img { max-width: 200px; max-height: 120px; object-fit: contain; margin-bottom: 24px; display: none; }
.logo-img.visible { display: block; margin: 0 auto 24px; }

/* ─── Social links ─── */
.social-row { display: flex; gap: 20px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
.social-link { display: flex; align-items: center; gap: 8px; color: var(--text2); font-size: 20px; font-family: Poppins, sans-serif; opacity: 0.8; }
.social-link .platform { color: var(--accent); font-weight: 600; font-size: 16px; font-family: var(--font), sans-serif; text-transform: uppercase; letter-spacing: 1px; }
.social-link .handle { font-size: 18px; }

/* ─── Particles canvas ─── */
#particles { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

/* ─── Co-players panel ─── */
#coPlayersPanel{position:absolute;bottom:70px;flex-direction:column;gap:7px;z-index:3;max-width:800px;}
#coPlayersPanel.pos-left{left:60px;right:auto;align-items:flex-start;}
#coPlayersPanel.pos-center{left:50%;transform:translateX(-50%);right:auto;align-items:center;}
#coPlayersPanel.pos-right{right:60px;left:auto;align-items:flex-end;}
.cp-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text2);margin-bottom:2px;white-space:nowrap;}
.cp-chip{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;font-size:14px;font-weight:600;color:var(--text1);letter-spacing:1px;white-space:nowrap;}
.cp-twitch{font-size:11px;color:var(--accent);opacity:.9;letter-spacing:.5px;}

/* ─── Games panel ─── */
#gamesPanel{position:absolute;top:80px;flex-direction:column;gap:6px;z-index:3;max-width:700px;}
#gamesPanel.pos-left{left:60px;right:auto;align-items:flex-start;}
#gamesPanel.pos-center{left:50%;transform:translateX(-50%);right:auto;align-items:center;}
#gamesPanel.pos-right{right:60px;left:auto;align-items:flex-end;}
.gp-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text2);margin-bottom:2px;white-space:nowrap;}
.gp-chip{display:block;padding:7px 18px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text2);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);letter-spacing:1px;white-space:nowrap;}
.gp-chip.current{color:var(--text1);background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--accent);}

/* ─── Video overlay ─── */
#videoOverlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 1; pointer-events: none;
    display: none; transition: opacity 0.8s ease;
}

/* ─── Smooth transitions ─── */
#overlay { transition: background 0.6s ease; }
.scene-title { transition: font-size 0.3s ease; }

/* ─── Fade-in animation ─── */
.scene-card { animation: sceneFadeIn 1.5s ease forwards; }
@keyframes sceneFadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.float-anim .scene-card { animation: sceneFloat 6s ease-in-out infinite; }
@keyframes sceneFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
.slide-anim .scene-card { animation: sceneSlide 1.2s cubic-bezier(.22,1,.36,1) forwards; }
@keyframes sceneSlide { from{opacity:0;transform:translateX(-60px)} to{opacity:1;transform:translateX(0)} }
.bounce-anim .scene-card { animation: sceneBounce 1s cubic-bezier(.36,.07,.19,.97) forwards; }
@keyframes sceneBounce { 0%{opacity:0;transform:scale(.5)} 60%{transform:scale(1.05)} 80%{transform:scale(.97)} 100%{opacity:1;transform:scale(1)} }
.pulse-anim .countdown-display { animation: countPulse 1s ease-in-out infinite alternate; }
@keyframes countPulse { from{opacity:.8;transform:scale(1)} to{opacity:1;transform:scale(1.03)} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Boogaloo&family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Creepster&family=DM+Sans:wght@400;500;700&family=Exo+2:wght@400;600;700&family=Fira+Code:wght@400;500&family=Fredoka+One&family=Goldman:wght@400;700&family=Inter:wght@400;500;600;700&family=Lobster&family=Lora:wght@400;600;700&family=Manrope:wght@400;500;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&family=Pacifico&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Press+Start+2P&family=Quantico:wght@400;700&family=Rajdhani:wght@400;500;600;700&family=Righteous&family=Roboto:wght@400;500;700&family=Russo+One&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;600&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlays/static/css/overlays-effects.css?v={{ v }}">
</head>
<body>
<div id="overlay" class="minimal">
    <canvas id="particles"></canvas>
    <canvas id="bg-effects" width="1920" height="1080"></canvas>
    <video id="videoOverlay" autoplay loop playsinline></video>
    <div id="ytOverlayWrap" style="position:absolute;inset:0;width:1920px;height:1080px;z-index:1;pointer-events:none;display:none;overflow:hidden;"></div>
    <div id="bgMusicYTWrap" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;pointer-events:none;"></div>
    <div class="scene-card">
        <img id="logoImg" class="logo-img" src="" alt="">
        <div id="sceneTitle" class="scene-title">Starting Soon</div>
        <div id="sceneSubtitle" class="scene-subtitle">The stream begins shortly...</div>
        <div class="divider"></div>
        <div id="countdown" class="countdown-display">00:00:00</div>
        <div id="socialRow" class="social-row"></div>
    </div>
    <div id="gamesPanel" style="display:none"></div>
    <div id="coPlayersPanel" style="display:none"></div>
</div>
<script src="/overlays/static/js/overlays-effects.js?v={{ v }}"></script>
<script>
const SCENE_ID = '{{ scene_id }}';
const DISCORD_USER_ID = '{{ discord_user_id }}';
const IS_OBS = typeof window.obsstudio !== 'undefined' || /OBS/i.test(navigator.userAgent);
let config = {};
let countdownInterval = null;
let particleAnim = null;
let particles = [];
// Track canvas animation state to avoid unnecessary restarts
let _prevBgEffect = '__init__';
let _prevBgSpeed = '__init__';
let _prevParticles = '__init__';
let _prevParticleColor = '__init__';

async function loadConfig(retries = 5, delay = 1000) {
    for (let i = 0; i < retries; i++) {
        try {
            const r = await fetch('/overlays/api/scenes/' + SCENE_ID + '/config');
            if (r.ok) { config = await r.json(); applyConfig(config); return; }
        } catch(e) {}
        if (i < retries - 1) await new Promise(res => setTimeout(res, delay));
    }
}

function applyConfig(cfg) {
    config = cfg;
    const el = document.getElementById('overlay');

    // Background
    el.className = (cfg.template || 'minimal');
    const bgType = cfg.background_type || 'gradient';
    if (bgType === 'solid') {
        el.style.setProperty('--bg', cfg.bg_color || '#0a0a1a');
        el.style.background = cfg.bg_color || '#0a0a1a';
        el.style.backgroundImage = 'none';
    } else if (bgType === 'gradient' || bgType === 'animated-gradient') {
        el.style.setProperty('--bg', cfg.bg_gradient_from || '#0a0a1a');
        el.style.setProperty('--bg2', cfg.bg_gradient_to || '#1a0a2e');
        el.style.setProperty('--bg-angle', (cfg.bg_gradient_angle || 135) + 'deg');
        if (bgType === 'animated-gradient') el.classList.add('bg-animated-gradient');
        else { el.style.background = `linear-gradient(${cfg.bg_gradient_angle||135}deg, ${cfg.bg_gradient_from||'#0a0a1a'}, ${cfg.bg_gradient_to||'#1a0a2e'})`; }
    }

    el.style.setProperty('--accent', cfg.accent_color || '#7c3aed');
    el.style.setProperty('--text1', cfg.text_primary || '#ffffff');
    el.style.setProperty('--text2', cfg.text_secondary || '#a0a0c0');
    applyFontConfig(cfg, el);
    applyAnimationClass(cfg, el);

    // Text
    document.getElementById('sceneTitle').textContent = cfg.title || 'Starting Soon';
    document.getElementById('sceneSubtitle').textContent = cfg.subtitle || '';

    // Font size override (0 / empty = use theme default)
    const titlePx = parseInt(cfg.title_size);
    document.getElementById('sceneTitle').style.fontSize = titlePx > 0 ? titlePx + 'px' : '';

    // Logo
    const logoImg = document.getElementById('logoImg');
    if (cfg.logo_url) { logoImg.src = cfg.logo_url; logoImg.classList.add('visible'); }
    else logoImg.classList.remove('visible');
    applyTextEffect(cfg, el);
    applyLogoEffect(cfg, el);

    // Background effect — restart canvas if effect type or speed changed
    const _curBgSpeed = cfg.bg_effect_speed ?? 1.0;
    if (cfg.background_effect !== _prevBgEffect || _curBgSpeed !== _prevBgSpeed) {
        _prevBgEffect = cfg.background_effect;
        _prevBgSpeed = _curBgSpeed;
        applyBackgroundEffect(cfg);
    }

    // Countdown
    if (countdownInterval) clearInterval(countdownInterval);
    const countdownEl = document.getElementById('countdown');
    if (!cfg.show_countdown) {
        countdownEl.style.display = 'none';
        countdownEl.textContent = '';
    } else if (cfg.countdown_to) {
        countdownEl.style.display = '';
        const target = new Date(cfg.countdown_to).getTime();
        function updateCountdown() {
            const diff = target - Date.now();
            if (diff <= 0) { countdownEl.textContent = cfg.countdown_end_text || 'LIVE!'; clearInterval(countdownInterval); return; }
            const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            countdownEl.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        }
        updateCountdown();
        countdownInterval = setInterval(updateCountdown, 1000);
    } else {
        countdownEl.style.display = '';
        countdownEl.textContent = '';
    }

    // Social links
    const social = cfg.social || {};
    const socialRow = document.getElementById('socialRow');
    socialRow.innerHTML = '';
    const icons = {twitch:'🎮', twitter:'🐦', discord:'💬', youtube:'▶️', instagram:'📷', tiktok:'🎵'};
    Object.entries(social).forEach(([platform, handle]) => {
        if (!handle) return;
        const d = document.createElement('div');
        d.className = 'social-link';
        d.innerHTML = `<span class="platform">${platform}</span><span class="handle">${handle}</span>`;
        socialRow.appendChild(d);
    });

    // Particles — only restart if relevant settings changed
    const newParticleColor = cfg.particle_color || cfg.accent_color || '#7c3aed';
    if (cfg.particles !== _prevParticles || newParticleColor !== _prevParticleColor) {
        _prevParticles = cfg.particles;
        _prevParticleColor = newParticleColor;
        if (particleAnim) cancelAnimationFrame(particleAnim);
        if (cfg.particles) initParticles(newParticleColor);
        else { const canvas = document.getElementById('particles'); const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,1920,1080); }
    }

    // Custom CSS
    let styleTag = document.getElementById('custom-style');
    if (!styleTag) { styleTag = document.createElement('style'); styleTag.id = 'custom-style'; document.head.appendChild(styleTag); }
    styleTag.textContent = cfg.custom_css || '';

    // Extras
    applyFeaturedPeople(cfg);
    applyGames(cfg);
    applyBranding(cfg);
    applyVisualFX(cfg, el);
    applyClock(cfg);
    applyGoalBar(cfg);
    applyViewerQueue(cfg);
    applyVideoOverlay(cfg);
    applyBgMusic(cfg);
    if(cfg.show_alerts)initSceneAlerts(DISCORD_USER_ID,cfg.scene_alert_position);
}

function escText(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function applyFeaturedPeople(cfg) {
    const panel = document.getElementById('coPlayersPanel');
    if (!panel) return;
    const players = cfg.co_players || [];
    panel.className = 'pos-' + (cfg.co_players_position || 'right');
    if (players.length > 0) {
        panel.style.display = 'flex';
        panel.innerHTML = '<span class="cp-label">Playing with</span>' +
            players.map(p => `<span class="cp-chip"><span>${escText(p.name)}</span>${p.twitch ? `<span class="cp-twitch">${escText(p.twitch)}</span>` : ''}</span>`).join('');
    } else {
        panel.style.display = 'none';
    }
}

function applyGames(cfg) {
    const panel = document.getElementById('gamesPanel');
    if (!panel) return;
    const games = cfg.games_list || [];
    panel.className = 'pos-' + (cfg.games_position || 'right');
    if (games.length > 0) {
        panel.style.display = 'flex';
        panel.innerHTML = '<span class="gp-label">Games being played this stream</span>' +
            games.map((g, i) => `<span class="gp-chip${i === 0 ? ' current' : ''}">${escText(g.title)}</span>`).join('');
    } else {
        panel.style.display = 'none';
    }
}

function initParticles(color) {
    const canvas = document.getElementById('particles');
    canvas.width = 1920; canvas.height = 1080;
    const ctx = canvas.getContext('2d');
    particles = Array.from({length:80}, () => ({
        x: Math.random()*1920, y: Math.random()*1080,
        vx: (Math.random()-.5)*.6, vy: (Math.random()-.5)*.6,
        r: Math.random()*2+.5, alpha: Math.random()*.5+.1
    }));
    function draw() {
        ctx.clearRect(0,0,1920,1080);
        particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x<0)p.x=1920; if(p.x>1920)p.x=0;
            if(p.y<0)p.y=1080; if(p.y>1080)p.y=0;
            ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle = hexAlpha(color, p.alpha); ctx.fill();
        });
        particleAnim = requestAnimationFrame(draw);
    }
    draw();
}

function hexAlpha(hex, a) {
    const r=parseInt(hex.slice(1,3)||'7c',16), g=parseInt(hex.slice(3,5)||'3a',16), b=parseInt(hex.slice(5,7)||'ed',16);
    return `rgba(${r},${g},${b},${a})`;
}

let _videoOverlayUrl = null;
let _ytOverlayPlayer = null;
let _ytOverlayApiReady = null;

function _ytVideoIdOverlay(url) {
    try {
        const u = new URL(url);
        if (u.hostname === 'youtu.be') return u.pathname.slice(1).split('?')[0];
        if (u.hostname.includes('youtube.com')) {
            if (u.searchParams.get('v')) return u.searchParams.get('v');
            const m = u.pathname.match(/\/(?:shorts|embed|v)\/([^/?&]+)/);
            if (m) return m[1];
        }
    } catch {}
    return null;
}

function _loadYTApiOverlay() {
    if (_ytOverlayApiReady) return _ytOverlayApiReady;
    _ytOverlayApiReady = new Promise(resolve => {
        if (window.YT && window.YT.Player) { resolve(); return; }
        const prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => { if (prev) prev(); resolve(); };
        if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
            const s = document.createElement('script');
            s.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(s);
        }
    });
    return _ytOverlayApiReady;
}

function _destroyYtOverlay() {
    if (_ytOverlayPlayer) { try { _ytOverlayPlayer.destroy(); } catch {} _ytOverlayPlayer = null; }
    const wrap = document.getElementById('ytOverlayWrap');
    if (wrap) wrap.innerHTML = '';
}

async function applyVideoOverlay(cfg) {
    const vid    = document.getElementById('videoOverlay');
    const ytWrap = document.getElementById('ytOverlayWrap');
    if (!vid || !ytWrap) return;

    if (!cfg.video_overlay || !cfg.video_overlay_url) {
        vid.style.display = 'none';
        vid.pause();
        ytWrap.style.display = 'none';
        _destroyYtOverlay();
        _videoOverlayUrl = null;
        return;
    }

    const opacity = (parseInt(cfg.video_overlay_opacity) ?? 15) / 100;
    const blend   = cfg.video_overlay_blend || 'normal';
    const videoId = _ytVideoIdOverlay(cfg.video_overlay_url);

    // If only opacity/blend changed, just update — don't reload the video
    if (cfg.video_overlay_url === _videoOverlayUrl) {
        (videoId ? ytWrap : vid).style.opacity      = opacity;
        (videoId ? ytWrap : vid).style.mixBlendMode = blend;
        return;
    }
    _videoOverlayUrl = cfg.video_overlay_url;

    const withAudio  = IS_OBS && !!cfg.video_overlay_audio;
    const audioVol   = (parseInt(cfg.video_overlay_volume) ?? 80) / 100;

    if (videoId) {
        // ── YouTube path ──────────────────────────────────────────────────
        vid.style.display = 'none';
        vid.pause();
        _destroyYtOverlay();
        await _loadYTApiOverlay();

        const inner = document.createElement('div');
        ytWrap.appendChild(inner);
        ytWrap.style.opacity      = opacity;
        ytWrap.style.mixBlendMode = blend;
        ytWrap.style.display      = '';

        _ytOverlayPlayer = new YT.Player(inner, {
            videoId,
            width: '1920', height: '1080',
            playerVars: {
                autoplay: 1, mute: withAudio ? 0 : 1, controls: 0, modestbranding: 1,
                loop: 1, playlist: videoId, playsinline: 1,
                rel: 0, iv_load_policy: 3, disablekb: 1
            },
            events: {
                onReady(e) {
                    if (withAudio) e.target.setVolume(Math.round(audioVol * 100));
                    else e.target.setVolume(0);
                    e.target.playVideo();
                }
            }
        });
    } else {
        // ── Direct video path ─────────────────────────────────────────────
        ytWrap.style.display = 'none';
        _destroyYtOverlay();
        vid.style.opacity      = opacity;
        vid.style.mixBlendMode = blend;
        vid.muted  = !withAudio;
        vid.volume = withAudio ? audioVol : 0;
        vid.src = cfg.video_overlay_url;
        vid.load();
        vid.play().catch(() => {});
        vid.style.display = '';
    }
}

// ── Background Music ──────────────────────────────────────────────────────────
let _bgMusicUrl  = null;
let _bgMusicAudio = null;
let _bgMusicYT   = null;
let _bgMusicFade = null;

function _ytVideoIdMusic(url) {
    try {
        const u = new URL(url);
        if (u.hostname === 'youtu.be') return u.pathname.slice(1).split('?')[0];
        if (u.hostname.includes('youtube.com')) {
            if (u.searchParams.get('v')) return u.searchParams.get('v');
            const m = u.pathname.match(/\/(?:shorts|embed|v)\/([^/?&]+)/);
            if (m) return m[1];
        }
    } catch {}
    return null;
}

function _stopBgMusic() {
    clearInterval(_bgMusicFade);
    if (_bgMusicAudio) { _bgMusicAudio.pause(); _bgMusicAudio = null; }
    if (_bgMusicYT) { try { _bgMusicYT.stopVideo(); _bgMusicYT.destroy(); } catch {} _bgMusicYT = null; }
    const wrap = document.getElementById('bgMusicYTWrap');
    if (wrap) wrap.innerHTML = '';
}

function _fadeInTo(targetVol, durationSecs) {
    clearInterval(_bgMusicFade);
    if (durationSecs <= 0) {
        if (_bgMusicAudio) _bgMusicAudio.volume = targetVol;
        if (_bgMusicYT)   { try { _bgMusicYT.setVolume(Math.round(targetVol * 100)); } catch {} }
        return;
    }
    const steps = Math.max(1, Math.round(durationSecs * 20));
    const step  = targetVol / steps;
    let cur = 0;
    _bgMusicFade = setInterval(() => {
        cur = Math.min(cur + step, targetVol);
        if (_bgMusicAudio) _bgMusicAudio.volume = cur;
        if (_bgMusicYT)   { try { _bgMusicYT.setVolume(Math.round(cur * 100)); } catch {} }
        if (cur >= targetVol) clearInterval(_bgMusicFade);
    }, 50);
}

async function applyBgMusic(cfg) {
    if (!IS_OBS || !cfg.bg_music_url) { _stopBgMusic(); _bgMusicUrl = null; return; }

    const volume  = (parseInt(cfg.bg_music_volume) ?? 50) / 100;
    const loop    = cfg.bg_music_loop !== false;
    const fadeIn  = parseInt(cfg.bg_music_fade_in) || 0;
    const videoId = _ytVideoIdMusic(cfg.bg_music_url);

    // If URL unchanged, just update volume/loop live
    if (cfg.bg_music_url === _bgMusicUrl) {
        if (_bgMusicAudio) { _bgMusicAudio.volume = volume; _bgMusicAudio.loop = loop; }
        if (_bgMusicYT) { try { _bgMusicYT.setVolume(Math.round(volume * 100)); } catch {} }
        return;
    }

    _stopBgMusic();
    _bgMusicUrl = cfg.bg_music_url;

    if (videoId) {
        // YouTube music — reuse the same IFrame API loader already on the page
        await _loadYTApiOverlay();
        const wrap  = document.getElementById('bgMusicYTWrap');
        const inner = document.createElement('div');
        wrap.appendChild(inner);
        _bgMusicYT = new YT.Player(inner, {
            videoId,
            width: '1', height: '1',
            playerVars: {
                autoplay: 1, controls: 0, modestbranding: 1,
                loop: loop ? 1 : 0, playlist: videoId,
                playsinline: 1, rel: 0, iv_load_policy: 3
            },
            events: {
                onReady(e) {
                    e.target.setVolume(0);
                    e.target.playVideo();
                    setTimeout(() => _fadeInTo(volume, fadeIn), 800);
                },
                onStateChange(e) {
                    if (e.data === YT.PlayerState.ENDED && loop) {
                        e.target.seekTo(0); e.target.playVideo();
                    }
                }
            }
        });
    } else {
        // Direct MP3 / audio file
        _bgMusicAudio = new Audio(cfg.bg_music_url);
        _bgMusicAudio.loop   = loop;
        _bgMusicAudio.volume = 0;
        _bgMusicAudio.play().then(() => _fadeInTo(volume, fadeIn)).catch(() => {});
    }
}

// SSE for live updates
function connectSSE() {
    const es = new EventSource('/overlays/source/' + SCENE_ID + '/events');
    es.onmessage = e => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'update') applyConfig(msg.config); else if (msg.type === 'channel_points_reaction') handleChannelPointsReaction(msg.reaction, msg.event);
    };
    es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
}

loadConfig().then(() => connectSSE());

// Instant preview updates from the editor (bypasses SSE delay)
window.addEventListener('message', e => {
    if (e.data && e.data.type === 'preview-update') applyConfig(e.data.config);
});
</script>
