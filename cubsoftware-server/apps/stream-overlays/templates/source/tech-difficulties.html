<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>Technical Difficulties</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;}
#overlay{width:1920px;height:1080px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
--bg:#0a0000;--bg2:#1a0000;--accent:#ff3333;--text1:#ff6666;--text2:#cc3333;--font:'Share Tech Mono';font-family:var(--font),monospace;background:var(--bg);}

/* Error screen aesthetic: static noise layer */
#overlay::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");opacity:.15;pointer-events:none;}

/* Scanlines */
#overlay::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.2) 3px,rgba(0,0,0,.2) 4px);pointer-events:none;animation:scanScroll 6s linear infinite;}
@keyframes scanScroll{from{background-position:0 0}to{background-position:0 100%}}

#particles{position:absolute;inset:0;z-index:1;pointer-events:none;}
.scene-card{position:relative;z-index:2;max-width:1100px;width:90%;text-align:center;}

/* Minimal/default */
#overlay.minimal .error-header,.error-header{font-size:14px;letter-spacing:6px;color:var(--text2);margin-bottom:20px;opacity:.7;}
#overlay.minimal .scene-title,.scene-title{font-size:48px;font-weight:700;color:var(--text1);letter-spacing:3px;line-height:1.2;}
#overlay.minimal .error-code,.error-code{font-size:22px;color:var(--text2);margin-top:12px;opacity:.7;}
#overlay.minimal .divider,.divider{width:80%;height:1px;background:var(--accent);opacity:.2;margin:20px auto;}
#overlay.minimal .scene-subtitle,.scene-subtitle{font-size:28px;color:var(--text2);opacity:.8;}
.blink{animation:blink 1.2s step-end infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Glitch animation */
.glitch-anim .scene-title{animation:glitch 3s infinite;}
@keyframes glitch{
0%{text-shadow:none;transform:none}
2%{text-shadow:2px 0 var(--accent),-2px 0 rgba(0,255,200,.5);transform:translateX(-2px)}
4%{text-shadow:-2px 0 var(--accent),2px 0 rgba(0,255,200,.5);transform:translateX(2px)}
6%{text-shadow:none;transform:none}
94%{text-shadow:none;transform:none}
96%{text-shadow:3px 0 var(--accent),-3px 0 rgba(0,255,200,.5);transform:skewX(-5deg)}
98%{text-shadow:none;transform:none}
100%{text-shadow:none;transform:none}
}

/* Neon variant */
#overlay.neon .scene-card{border:1px solid rgba(255,50,50,.3);border-radius:8px;padding:60px 80px;box-shadow:0 0 40px rgba(255,50,50,.15);}
#overlay.neon .scene-title{text-shadow:0 0 20px var(--accent);}
#overlay.neon .error-code{text-shadow:0 0 10px var(--accent);}

/* Retro variant */
#overlay.retro .scene-title{font-size:52px;}
#overlay.retro .error-header{letter-spacing:10px;}

/* Cozy variant */
#overlay.cozy{--bg:#0a0505;--bg2:#1a0808;--accent:#ff6666;--text1:#ffaaaa;--text2:#cc8888;}
#overlay.cozy .scene-card{background:rgba(255,50,50,.05);border-radius:16px;padding:60px 80px;border:1px solid rgba(255,80,80,.15);}

/* Gaming variant */
#overlay.gaming .scene-title{font-size:56px;font-family:Rajdhani,sans-serif;letter-spacing:6px;font-weight:700;}
#overlay.gaming::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,30,30,.1) 0%,transparent 60%);}

/* Static noise bars — hidden by default, shown only in glitch animation mode */
.static-bar{position:absolute;left:0;right:0;height:4px;background:rgba(255,100,100,.3);animation:staticMove 0.15s linear infinite;display:none;}
.static-bar:nth-child(2){animation-delay:.05s;height:2px;opacity:.5;}
#overlay.glitch-anim .static-bar{display:block;}
@keyframes staticMove{0%{top:0}100%{top:100%}}

/* Terminal cursor */
.cursor{display:inline-block;width:14px;height:28px;background:var(--text1);vertical-align:middle;margin-left:4px;animation:blink 1s step-end infinite;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Boogaloo&family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Creepster&family=DM+Sans:wght@400;500;700&family=Exo+2:wght@400;600;700&family=Fira+Code:wght@400;500&family=Fredoka+One&family=Goldman:wght@400;700&family=Inter:wght@400;500;600;700&family=Lobster&family=Lora:wght@400;600;700&family=Manrope:wght@400;500;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;700&family=Pacifico&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Press+Start+2P&family=Quantico:wght@400;700&family=Rajdhani:wght@400;500;600;700&family=Righteous&family=Roboto:wght@400;500;700&family=Russo+One&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;600&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&family=Teko:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/overlays/static/css/overlays-effects.css?v={{ v }}">
</head>
<body>
<div id="overlay" class="minimal glitch-anim">
    <canvas id="particles"></canvas>
    <canvas id="bg-effects" width="1920" height="1080"></canvas>
    <div class="static-bar"></div>
    <div class="static-bar"></div>
    <div class="scene-card">
        <div class="error-header">⚠ SYSTEM ERROR ⚠</div>
        <div id="sceneTitle" class="scene-title">TECHNICAL DIFFICULTIES</div>
        <div id="errorCode" class="error-code">ERR_STREAM_OFFLINE</div>
        <div class="divider"></div>
        <div id="sceneSubtitle" class="scene-subtitle">We'll be back shortly. Please stand by<span class="blink">_</span></div>
    </div>
</div>
<script src="/overlays/static/js/overlays-effects.js?v={{ v }}"></script>
<script>
const SCENE_ID='{{ scene_id }}';
const DISCORD_USER_ID='{{ discord_user_id }}';
async function loadConfig(){try{const r=await fetch('/overlays/api/scenes/'+SCENE_ID+'/config');if(r.ok){const c=await r.json();applyConfig(c);}}catch(e){}}
function applyConfig(cfg){
    const el=document.getElementById('overlay');
    el.className=(cfg.template||'minimal')+(cfg.animation==='glitch'?' glitch-anim':'');
    const bt=cfg.background_type||'solid';
    if(bt==='solid')el.style.background=cfg.bg_color||'#0a0000';
    else el.style.background=`linear-gradient(${cfg.bg_gradient_angle||180}deg,${cfg.bg_gradient_from||'#1a0000'},${cfg.bg_gradient_to||'#0a0000'})`;
    el.style.setProperty('--accent',cfg.accent_color||'#ff3333');
    el.style.setProperty('--text1',cfg.text_primary||'#ff6666');
    el.style.setProperty('--text2',cfg.text_secondary||'#cc3333');
    applyFontConfig(cfg, el);
    applyAnimationClass(cfg, el);
    document.getElementById('sceneTitle').textContent=cfg.title||'TECHNICAL DIFFICULTIES';
    document.getElementById('sceneSubtitle').textContent=cfg.subtitle||"We'll be back shortly. Please stand by";
    const ec=document.getElementById('errorCode');
    if(cfg.error_code){ec.textContent=cfg.error_code;ec.style.display='block';}else ec.style.display='none';
    applyTextEffect(cfg, el); applyLogoEffect(cfg, el); applyBackgroundEffect(cfg); applyBranding(cfg);
    let s=document.getElementById('custom-style');if(!s){s=document.createElement('style');s.id='custom-style';document.head.appendChild(s);}s.textContent=cfg.custom_css||'';
    applyVisualFX(cfg, el);
    applyClock(cfg);
    applyGoalBar(cfg);
    applyViewerQueue(cfg);
    if(cfg.show_alerts)initSceneAlerts(DISCORD_USER_ID,cfg.scene_alert_position);
}
function connectSSE(){const es=new EventSource('/overlays/source/'+SCENE_ID+'/events');es.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='update')applyConfig(m.config);};es.onerror=()=>{es.close();setTimeout(connectSSE,3000);};}
loadConfig().then(()=>connectSSE());
</script>
</body></html>
